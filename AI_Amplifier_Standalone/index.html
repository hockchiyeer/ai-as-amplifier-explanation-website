eluruh organisasi.",keyPoint:"Output 10× · Risiko 10× jika strategi cacat"},compounder:{title:"Kesan Pengkompaun",icon:"📈",description:"Kelebihan AI berkompaun dari semasa ke semasa. Pasukan yang membina sistem AI hari ini memperoleh kelebihan daya saing secara eksponen berbanding pesaing yang masih bergantung pada proses manusia yang linear. Tetapi jika dibina atas strategi yang cacat, AI turut mengkompaunkan ralat tanpa henti—mendorong organisasi ke arah hasil yang semakin mahal dan tidak boleh dipulihkan.",keyPoint:"Kelebihan eksponen atau kemerosotan eksponen—pengkompaunan berfungsi dua hala"}},mirrorPrinciple:{title:"Prinsip Cermin",subtitle:"AI Mencerminkan Diri Anda yang Sebenar",description:"AI ialah cermin kepada model operasi organisasi anda. Ia tidak membaiki strategi yang lemah—ia mendedahkannya dengan lebih pantas dan pada skala yang lebih besar. Sistem AI yang sama menghasilkan keputusan yang sangat berbeza bergantung pada kualiti strategi yang diperkuatkannya.",rule:"AI tidak membaiki strategi perniagaan yang lemah. Ia hanya menjadikan akibatnya muncul lebih cepat—sama ada baik atau buruk.",inputLabel:"Input",outputLabel:"Output",scenarios:{smart:{title:"Organisasi Bijak",emoji:"✅",label:"AI Mempercepat Kejayaan",input:"Kedudukan yang jelas, proses yang kukuh, data berkualiti, pertimbangan yang baik",output:"Kejelasan lebih pantas, pembelajaran dipercepat, pertumbuhan berkompaun"},mediocre:{title:"Organisasi Sederhana",emoji:"⚠️",label:"AI Meniru Kesederhanaan",input:"Kedudukan tidak jelas, proses purata, kualiti data bercampur",output:"Lebih banyak output, tetapi belum tentu lebih banyak kelebihan"},defective:{title:"Organisasi Cacat",emoji:"❌",label:"AI Memperkuat Kegagalan",input:"Kedudukan cacat, proses rosak, data lemah, pertimbangan lemah",output:"Kegagalan lebih pantas, pembaziran diperkuat, geseran dalaman berkompaun"}}},aiParadigms:{title:"Dua Paradigma AI",subtitle:"Memahami Penjana Bahasa berbanding Pelaksana Tugas",bestForLabel:"Terbaik Untuk",promptingTipLabel:"Petua Gesaan",paradigm1:{title:"Penjana Bahasa",tools:[{name:"ChatGPT",url:"https://chatgpt.com"},{name:"Google Gemini",url:"https://gemini.google.com"},{name:"DeepSeek",url:"https://www.deepseek.com"}],bestFor:["Sumbang saran dan pemikiran idea strategik","Penulisan panjang: laporan, analisis, artikel naratif","Tafsiran dan pengembangan dalam utas perbualan yang panjang","Alternatif yang lebih menjimatkan berbanding ejen terbenam dalam IDE"],promptingTip:"Gesaan yang terperinci, berbentuk perbualan dan kaya konteks → output yang lebih kaya dan menyeluruh"},paradigm2:{title:"Pelaksana Tugas",tools:[{name:"Claude AI",url:"https://claude.ai"},{name:"Manus AI",url:"https://manus.im"},{name:"Cursor Agents",url:"https://cursor.com"}],bestFor:["Pelaksanaan autonomi aliran kerja berbilang langkah","Penyelarasan alat, API, fail dan sistem","Pengaturcaraan, automasi dan operasi berejen","Tugas dengan keadaan akhir yang jelas"],promptingTip:"Ringkas, tertumpu pada tugas, format output yang jelas → memaksimumkan kualiti output ejen"}},caseStudies:{title:"Kajian Kes Dunia Sebenar",subtitle:"Bagaimana AI memperkuat kejayaan dan kegagalan",scenarioLabel:"Senario",outcomeLabel:"Hasil",lessonLabel:"Pengajaran Perniagaan Utama",case1:{title:"Kajian Kes #1: Kandungan Serangan terhadap Pesaing × Pengeluaran Berkelompok oleh AI",scenario:"Pasukan pemasaran menggunakan AI untuk menghasilkan kandungan serangan terhadap pesaing secara berkelompok di LinkedIn dan saluran sosial. Namun, strategi asasnya sudah pun mencetuskan reaksi balas yang kuat dalam industri.",outcome:"Semakin banyak kandungan yang mereka hasilkan dengan AI, semakin besar kesan negatif diperkuatkan. Lebih banyak kandungan ≠ lebih banyak pengaruh—ia menjadi kerosakan berskala lebih besar.",lesson:"Jika strategi anda sudah mencetuskan reaksi balas, menggunakan AI untuk menghasilkan lebih banyak kandungan hanya membesarkan masalah itu sepuluh kali ganda. Arah yang salah × kelajuan lebih tinggi = kegagalan lebih pantas."},case2:{title:"Kajian Kes #2: Produk Premium Bertemu Perkaitan Jenama yang Negatif",scenario:"Produk atau eksekutif berkualiti tinggi dikaitkan dengan jenama yang dipandang negatif. Kandungan yang dijana AI kemudian memperkuat isyarat yang salah itu pada skala besar.",outcome:"Rekod prestasi yang kukuh dan nilai pelanggan sebenar produk itu tidak dapat mengatasi halangan perkaitan jenama. Lebih banyak kandungan AI = penolakan lebih pantas daripada segmen pasaran utama.",lesson:"Kandungan AI memperkuat persepsi sedia ada—sama ada positif atau negatif. Produk yang kukuh yang dikaitkan dengan isyarat jenama yang lemah akan menyaksikan AI mempercepatkan penolakan, bukan mengatasinya."}},useCases:{title:"Di Mana AI Mencipta Daya Ungkit",subtitle:"Fungsi perniagaan di mana AI memberikan nilai maksimum",sales:{title:"Jualan",cases:["Penyelidikan dan penemuan pelanggan","Persediaan dan strategi panggilan","Penggubalan e-mel susulan","Pengendalian bantahan dan sanggahan"]},marketing:{title:"Pemasaran",cases:["Pengujian dan pengesahan mesej","Segmentasi dan penyasaran audiens","Penjanaan varian kandungan","Penjanaan idea dan strategi kempen"]},operations:{title:"Operasi",cases:["Dokumentasi dan ringkasan proses","Penggubalan SOP (Prosedur Operasi Standard)","Perolehan semula dan pengurusan pengetahuan","Automasi dan pengoptimuman aliran kerja"]},product:{title:"Produk",cases:["Integrasi dan analisis maklum balas pengguna","Andaian dan pengesahan peta jalan","Penentuan keutamaan dan kedudukan ciri","Penambahbaikan strategi produk"]},qa:{title:"QA",cases:["Penjanaan rangka kerja dan kerangka ujian","Pengenalpastian kes pinggir","Strategi ujian regresi","Ringkasan dan pelaporan kecacatan"]},competitiveIntelligence:{title:"Perisikan Persaingan",cases:["Pengimbasan dan pemantauan pasaran","Perancangan senario dan peramalan","Analisis kedudukan pesaing","Pengenalpastian trend industri"]}},promptingGuide:{title:"Panduan Gesaan Strategik",subtitle:"Mendapatkan Output AI yang Jujur dan Berkualiti Tinggi",introduction:"Hasil AI yang terbaik datang daripada soalan strategik yang tepat—bukan sekadar meminta penghasilan kandungan. Inilah cara memberi gesaan untuk mendapatkan pandangan yang sebenar.",keyInsight:"Minta pertimbangan strategik yang jujur dan jelas daripada AI—bukan penghasilan kandungan. Di sinilah nilai sebenar AI muncul.",doLabel:"✓ LAKUKAN",dontLabel:"✗ JANGAN",examples:[{correct:"Apakah keperluan pelanggan yang kini kita abaikan?",incorrect:"Tulis siaran akhbar pelancaran produk"},{correct:"Pertaruhan strategik manakah yang mempunyai nisbah impak-kepada-pelaburan tertinggi?",incorrect:"Jana 20 hantaran media sosial untuk jenama kita"},{correct:"Di manakah kita paling terdedah kepada gangguan persaingan?",incorrect:"Gubah kandungan serangan terhadap pesaing"},{correct:"Berterus terang: apakah titik buta dalam strategi kita?",incorrect:"Tulis 10 templat e-mel untuk pasukan jualan"},{correct:"Apakah peluang kemenangan pantas yang paling boleh dilaksanakan dalam 90 hari akan datang?",incorrect:"Cipta surat berita pelabur Q3"}]},vibeCoding:{title:"Vibe Coding: Pembangunan Dipertingkat AI",subtitle:"Menggunakan AI untuk memperkuat produktiviti dan kualiti pengekodan",description:"Vibe Coding ialah amalan menggunakan AI sebagai rakan kerjasama untuk memperkuat kelajuan pembangunan, kualiti kod dan keupayaan menyelesaikan masalah. Daripada menggantikan pembangun, AI menambah baik pertimbangan mereka dan mempercepatkan output mereka.",usefulTip:'**Petua Berguna:** Sentiasa bangunkan rangka aplikasi yang berfungsi sepenuhnya menggunakan alat berejen (seperti [Manus AI](https://manus.im/) atau [Claude AI](https://claude.ai/)), alat pengekodan AI berasaskan kanvas ([Google Gemini Canvas](https://gemini.google.com/canvas), [ChatGPT Canvas](https://chatgpt.com/)), atau minta [DeepSeek](https://deepseek.com/) menulis rangka Aplikasi Satu Halaman (Single Page Application) yang boleh dimuat turun atau dijalankan di Web. Kemudian, muat turun keseluruhan kod sumber aplikasi untuk meneruskan vibe-coding, pemfaktoran semula dan pengembangan ciri aplikasi menggunakan pemalam atau sambungan IDE daripada pelbagai model AI ([Antigravity](https://antigravity.google/), [VS Code MS Copilot](https://github.com/features/copilot), [VS Code Codex Extension](https://openai.com/codex/), dll.). Ini membolehkan AI memanfaatkan sepenuhnya "Kesan Pengkompaun" (Compounding Effect) di atas asas yang kukuh, dan bukannya cuba menjana setiap ciri yang anda bayangkan tanpa konteks, data atau butiran pembangunan dan reka bentuk sistem yang mencukupi.',tools:{title:"Alat AI Dunia Sebenar dalam Tindakan",bugGenie:{name:"BugGenie AI",subtitle:"Alat Penggubalan Tiket Pepijat yang dikuasakan oleh [ciri Canvas terbina dalam Google Gemini](https://gemini.google.com/canvas)",description:"Menukar tangkapan skrin dan artifak sokongan kepada laporan pepijat yang berstruktur dan profesional terus dalam pelayar—tiada bahagian belakang atau pemasangan diperlukan.",features:["Dikuasakan oleh [ciri Canvas Google Gemini](https://gemini.google.com/canvas) atau melalui [Build Apps Google AI Studio](https://aistudio.google.com/apps)","Berasaskan pelayar—tiada pemasangan, tiada langkah binaan","Menerima tangkapan skrin & artifak sokongan","Menghasilkan tiket pepijat berstruktur yang sedia difailkan"],githubLink:{label:"Kod Sumber Github",url:"https://github.com/hockchiyeer/ai-powered-auto-bug-ticket-logger"},aiStudioLink:{label:"Aplikasi Berasaskan Google AI Studio",url:"https://aistudio.google.com/apps/ce12cbda-aa17-405d-9018-96a8ef249d29?showPreview=true&showAssistant=true"},canvasLink:{label:"Aplikasi Berasaskan Google Gemini Canvas",url:"https://gemini.google.com/share/5a9916e135f0"}},agileMaturity:{name:"Aplikasi Penilaian Kematangan Agile",subtitle:"Aplikasi JavaScript Statik Natif Pelayar",description:"Aplikasi penilaian yang berdiri sendiri sepenuhnya dan berjalan dengan membuka index.html—tiada langkah binaan, tiada pemasangan pakej, tiada pelayan pembangunan diperlukan.",features:["100% natif pelayar—HTML, CSS & JS tulen","Tanpa kebergantungan: tiada npm, tiada pembungkus, tiada pelayan","Buka index.html secara terus untuk dijalankan setempat","Boleh dilancarkan ke GitHub Pages dalam satu langkah"],githubLink:{label:"Kod Sumber Github",url:"https://github.com/hockchiyeer/google-ai-studio-generated-agile-maturity-assessment-app"},appLink:{label:"Aplikasi",url:"https://hockchiyeer.github.io/google-ai-studio-generated-agile-maturity-assessment-app"}}},toolRankings:{title:"Kedudukan Alat AI untuk Tugas Pengekodan",subtitle:"Kecekapan, ketepatan & kualiti output (pengalaman peribadi)",tools:[{rank:1,name:"OpenAI Codex - GPT-5.5 Ultra High Thinking",score:"9.0/10",url:"https://openai.com/codex/"},{rank:2,name:"Google Antigravity - Claude Sonnet 4.6 High Thinking",score:"7.8/10",url:"https://antigravity.google/"},{rank:3,name:"Cursor Agents",score:"6.8/10",url:"https://cursor.com/agents"},{rank:4,name:"GitHub Copilot Free - GPT-4.1 mini model",score:"5.8/10",url:"https://github.com/features/copilot"},{rank:5,name:"Google Antigravity - Gemini Pro 3.1 High Thinking",score:"5.6/10",url:"https://antigravity.google/"}]}},strategicInsights:{title:"Soalan Strategik yang Kritikal",subtitle:"Bingkaikan semula kelebihan daya saing melalui pengagihan semula kapasiti oleh AI",question:"Jika pasukan anda berhenti sepenuhnya menghabiskan masa untuk tugas reaktif—menjawab pengumuman pesaing, menjana laporan rutin, mengurus komunikasi bernilai rendah—dan mengalihkan kapasiti yang dibebaskan itu kepada kerja strategik yang dipertingkat AI, apakah peluang pelaburan yang akan anda ceburi?",insight:'Soalan ini sering lebih hampir dengan sumber sebenar kelebihan daya saing berbanding: "Bagaimana kita bertindak balas terhadap pelancaran produk terkini pesaing kita?"',keyPoint:"Kelebihan daya saing yang sebenar bukan terletak pada melakukan lebih banyak, tetapi pada mengalihkan kapasiti manusia daripada kerja reaktif kepada pemikiran strategik—diperkuat oleh AI."},subtractPrinciple:{title:"Prinsip Pengurangan",subtitle:"Apabila AI tersasar, tetapkan semula—jangan diperkuatkan",description:"Apabila trajektori AI menjadi tidak produktif atau tidak selari, penyelesaiannya bukan menggunakan lebih banyak kuasa pengkomputeran atau menolak dengan lebih keras. Sebaliknya, tetapkan semula kepada keadaan bersih, tukar model atau suntik perspektif baharu.",corePrinciplesLabel:"Prinsip Teras:",principles:["Lebih banyak kuasa pengkomputeran pada trajektori yang cacat ialah kekerasan ke arah yang salah","Tetapkan semula kepada keadaan bersih apabila kualiti output AI merosot","Tukar model untuk mendapatkan perspektif dan pendekatan baharu","Suntik pertimbangan manusia untuk mengubah arah trajektori","Sedari bila pengukuhan menjadikan keadaan lebih buruk, bukan lebih baik"]},keyTakeaways:{title:"Rumusan Utama",subtitle:"Prinsip teras untuk kejayaan pelaksanaan AI",takeaways:[{icon:"⚡",title:"AI Ialah Penguat—Arah Paling Penting",description:"AI tidak menentukan hasil—strategi anda yang menentukannya. Strategi yang betul diperkuat untuk menghasilkan pulangan yang jauh lebih besar. Strategi yang cacat diperkuat untuk mempercepatkan kegagalan. Betulkan arah dahulu."},{icon:"✖",title:"Pengganda Berfungsi Dua Hala",description:"Setiap pelaksanaan AI ialah pengganda daya. Menghasilkan mesej yang cacat secara besar-besaran bukanlah kekuatan—ia kelemahan dalam kuantiti yang besar. Kejelasan strategik didarab dengan AI ialah satu-satunya jalan ke arah kelebihan yang tahan lama."},{icon:"📈",title:"Pengkompaun Memberi Ganjaran kepada Pelopor",description:"Kelebihan AI berkompaun melalui benteng data, aliran kerja dan kelajuan. Pasukan yang membina sistem AI hari ini mencipta pendahuluan yang tidak dapat dikejar oleh pengguna lewat—walau apa pun bajetnya."},{icon:"◆",title:"Miliki Strategi—Gunakan AI untuk Mempercepat",description:"Jana rangka kerja, dapatkan semula pengetahuan, analisis data dan kembangkan pelaksanaan dengan AI. Tetapi sentiasa miliki sendiri logik strategik, andaian teras dan standard kualiti."},{icon:"−",title:"Prinsip Pengurangan: Tetapkan Semula, Jangan Diperkuatkan",description:"Apabila AI tersasar—tetapkan semula kepada keadaan bersih, tukar model, suntik perspektif baharu. Lebih banyak kuasa pengkomputeran pada trajektori yang cacat ialah kekerasan ke arah yang salah."}]},aiJourney:{title:"Perjalanan AI Anda",subtitle:"Bermula di sini",tagline:"Bukan dengan menggunakan AI untuk bercakap lebih banyak, tetapi dengan menggunakan AI untuk melihat dengan lebih jelas apa yang sebenarnya anda lakukan",steps:[{step:1,title:"Perkuat",description:"strategi yang betul"},{step:2,title:"Gandakan",description:"pelaksanaan yang berkesan"},{step:3,title:"Kompaunkan",description:"kelebihan daya saing"}],cta:"Mulakan transformasi anda hari ini",author:"Er Hock Chiye | Pengamal Kes Penggunaan AI"},crossModelValidation:{title:"Aliran Kerja Pengesahan Silang Model",subtitle:"Mengurangkan halusinasi dan meluaskan konteks dengan [Google NotebookLM](https://notebooklm.google.com/)",description:"Jangan berhenti pada kesimpulan satu model AI sahaja. Gunakan gesaan yang sama merentasi beberapa model untuk mengesahkan silang dan menyintesis pandangan yang lebih mendalam.",steps:[{title:"Wujudkan Garis Asas",description:"Bina pangkalan pengetahuan awal dengan mengimport PDF, laporan dan data ke dalam NotebookLM."},{title:"Ujian Selari",description:"Hantar gesaan yang sama kepada beberapa model (cth., [ChatGPT](https://chatgpt.com/), [Gemini](https://gemini.google.com/), [Claude](https://claude.ai/), [DeepSeek](https://deepseek.com/), [Qwen](https://chat.qwen.ai/))."},{title:"Sintesis & Selaraskan",description:"Eksport jawapan tersebut dan import semula ke dalam NotebookLM untuk meringkaskan persetujuan dan menentukan perbezaan."},{title:"Pertimbangan Akhir",description:"Gunakan pandangan yang disatukan untuk membentuk strategi yang teguh—sentiasa mengekalkan akauntabiliti manusia."}]},aiRedTeaming:{title:"AI Red Teaming",subtitle:"Biarkan AI memainkan peranan CEO pesaing anda",description:"Paksa AI mencari kelemahan yang paling mungkin dieksploitasi terhadap anda, sebelum pesaing anda melakukannya.",questions:["Jika pesaing utama kita melancarkan kempen agresif pada suku hadapan, apakah sudut yang paling merosakkan yang akan mereka gunakan?","Apakah 3 kelemahan teratas yang tidak dipertahankan yang boleh dieksploitasi oleh pesaing bermodal besar sekarang?","Segmen pasaran manakah yang paling terdedah untuk direbut oleh tawaran pesaing?","Apakah andaian strategik yang kita pegang yang paling mungkin salah?"]},productionObservations:{title:"4 Pemerhatian Utama daripada AI dalam Pengeluaran",subtitle:"Pengajaran yang diperoleh dengan susah payah daripada pelaksanaan AI berbilang model jangka panjang",observations:[{title:"Hanyutan Keperluan",description:"Konteks berpecah-pecah dalam utas yang panjang. Model menyimpang daripada matlamat strategik awal. Sentiasa tetapkan semula kepada prinsip asas."},{title:"Tidak Dioptimumkan untuk Kualiti",description:"Model menghasilkan logik yang cacat dengan penuh keyakinan. Wujudkan pengesahan manusia yang jelas untuk keputusan berisiko tinggi."},{title:"Keluasan Tanpa Kedalaman",description:"Output AI menawarkan liputan yang mengagumkan tetapi terlepas kes pinggir kritikal yang menentukan kejayaan dunia sebenar."},{title:"Perangkap Delegasi",description:"Menyerahkan strategi kepada AI mungkin memberi hasil yang pantas, tetapi kelajuan tanpa ketepatan ialah liabiliti."}]},aiMoats:{title:"Membina Benteng AI Jangka Panjang",subtitle:"Kesan pengkompaunan daripada penerimaan awal AI",description:"Kelebihan AI berkompaun dari semasa ke semasa. Pelopor membina benteng data dan aliran kerja yang tidak dapat diatasi oleh pengguna lewat, walau apa pun bajetnya.",timeline:[{period:"Bulan 1-3",title:"Penerimaan",description:"Melaksanakan alat, membina pustaka gesaan dan memperoleh keuntungan kecekapan awal."},{period:"Bulan 4-6",title:"Integrasi",description:"AI menjadi sebati dalam proses teras. Pengetahuan organisasi mula berkompaun."},{period:"Bulan 7-12",title:"Pensistematikan",description:"Sistem AI saling menyuap. Data pelanggan memperhalusi strategi produk; data jualan memaklumkan pemasaran."},{period:"Tahun 2+",title:"Pengkompaunan",description:"Benteng data secara eksponen dan gelung maklum balas yang mengukuh diri terbentuk."}]},pptShowcase:{title:"Dek Slaid tentang Aplikasi AI",subtitle:"Pratonton dan muat turun dwibahasa",description:"Tiga dek slaid contoh yang menunjukkan bagaimana satu rangka kerja aplikasi AI boleh dipindahkan merentasi pengujian, politik dan strategi perniagaan.",conclusionText:"Dalam era sumber pengkomputeran, model dan pengetahuan yang semakin melimpah, menguasai satu rangka kerja aplikasi AI sering membolehkan perpindahan pantas merentasi pelbagai industri dan bidang.",caseLabel:"Kes",caseExample:"Automasi Ujian → Muslihat Politik → Strategi Perniagaan",items:[{id:"amplifier",filename:"AI_As_Amplifier_Multiplier_Compounder_Chinese_version_35_slides.pptx",title:"AI sebagai Penguat — Edisi Cina",caption:"Dalam era sumber pengkomputeran, model dan pengetahuan yang semakin melimpah, menguasai satu rangka kerja aplikasi AI membolehkan perpindahan pantas ke pelbagai industri dan bidang."},{id:"testing",filename:"AI_in_Software_Test_Automation_ByErHockChiye.pptx",title:"AI dalam Automasi Ujian Perisian",caption:"Contoh aplikasi praktikal AI dalam automasi ujian perisian dan perpindahan rangka kerja."},{id:"politics",filename:"AI政治策略课程_完整版.pptx",title:"Kursus Strategi Politik AI",caption:"Kes aplikasi AI dan rangka kerja strategi untuk pilihan raya dan penggerakan organisasi politik."}],preview:"Pratonton",download:"Muat Turun"},footer:{aboutTitle:"Tentang Laman Ini",aboutText:"Sumber pendidikan ini meneroka bagaimana AI memperkuat keupayaan organisasi—sama ada baik atau buruk. Prinsip strategik yang dibentangkan di sini diambil daripada kajian kes dunia sebenar dan amalan terbaik dalam pelaksanaan AI.",keyTakeaway:"Rumusan Utama",keyTakeawayText:"AI tidak menjadikan anda lebih bijak. Ia memperkuat apa yang sudah anda lakukan. Persoalannya bukan sama ada untuk menggunakan AI—tetapi sama ada strategi anda cukup kukuh untuk diperkuatkan."}},yc={en:{meta:{title:"AI as an Amplifier, Multiplier, and Compounder",description:"Learn how AI amplifies, multiplies, and compounds your organizational capabilities. An interactive educational resource on AI strategy for business leaders."},skipToContent:"Skip to main content",mainNav:"Main navigation",contents:"Contents",contentsTitle:"Tutorial contents",contentsHint:"Pick any step to jump straight to it. Your progress is saved on this device.",close:"Close",openMenu:"Open menu",closeMenu:"Close menu",languageLabel:"Language",languageNames:{en:"English",zh:"中文 (Chinese)",ms:"Bahasa Melayu"},intro:"Introduction",stepOf:"Step {n} of {total}",previous:"Previous",next:"Next",backToTop:"Back to top",markDone:"Mark step as done",markedDone:"Done",progressSummary:"{done} of {total} steps done",resetProgress:"Reset progress",readingProgress:"Reading progress",expandDetails:"Expand details",collapseDetails:"Collapse details",slideRefs:"See it in the slides",slideWord:"Slide",opensInNewTab:"(opens in a new tab)",slideOf:"Slide {n} of {total}",viewSlide:"View slide {n}: {title}",slideCount:"{n} slides",openViewer:"Open slide viewer",closeViewer:"Close slide viewer",prevSlide:"Previous slide",nextSlide:"Next slide",thumbnails:"Slide thumbnails",textVersion:"Text version of this slide",noSlideText:"This slide contains no extractable text.",loadFailed:"This slide image could not be loaded.",retry:"Try again",noPreview:"No preview",slidesNote:"Slide images and their text are shown in the language of the original decks.",copyright:"© 2026 AI Amplifier. All rights reserved."},zh:{meta:{title:"AI 作为放大器、倍增器与复利器",description:"了解 AI 如何放大、倍增并复利你的组织能力。一份面向企业领导者的 AI 战略互动教育资源。"},skipToCont  dalam tab baharu)",slideOf:"Slaid {n} daripada {total}",viewSlide:"Lihat slaid {n}: {title}",slideCount:"{n} slaid",openViewer:"Buka pemapar slaid",closeViewer:"Tutup pemapar slaid",prevSlide:"Slaid sebelumnya",nextSlide:"Slaid seterusnya",thumbnails:"Gambar kecil slaid",textVersion:"Versi teks slaid ini",noSlideText:"Slaid ini tidak mengandungi teks yang boleh diekstrak.",loadFailed:"Imej slaid ini tidak dapat dimuatkan.",retry:"Cuba lagi",noPreview:"Tiada pratonton",slidesNote:"Imej slaid dan teksnya dipaparkan dalam bahasa dek asal.",copyright:"© 2026 AI Amplifier. Hak cipta terpelihara."}},Wh=["en","zh","ms"],eg={en:{nav:{home:"Home",threeEffects:"Three Effects",mirrorPrinciple:"Mirror Principle",aiParadigms:"AI Paradigms",caseStudies:"Case Studies",useCases:"Use Cases",promptingGuide:"Prompting Guide",vibeCoding:"Vibe Coding",strategicInsights:"Strategy",crossModelValidation:"Validation",aiRedTeaming:"Red Teaming",productionObservations:"Observations",aiMoats:"AI Moats",keyTakeaways:"Takeaways",pptShowcase:"Slides",subtractPrinciple:"Subtract",aiJourney:"Journey",language:"中文"},hero:{mainHeading:"AI as an Amplifier, Multiplier, and Compounder",subheading:"How AI magnifies your competitive advantage—or accelerates your strategic mistakes.",description:"In the age of abundant computing resources, AI doesn't make you smarter. It amplifies what you already do—for better or worse. Learn how to harness AI as a strategic multiplier while avoiding the pitfalls that turn competitive advantages into compounded failures.",cta:"Explore the Three Effects"},threeEffects:{title:"The Three Effects of AI Deployment",subtitle:"How AI amplifies, multiplies, and compounds your organizational capabilities",amplifier:{title:"The Amplifier Effect",icon:"⚡",description:"AI magnifies every action's impact—whether good or bad. A correct strategy produces outsized returns; a flawed strategy accelerates failure. AI doesn't create strategy; it exposes and amplifies what's already there.",keyPoint:"Faster · Cheaper · More Efficient—in the direction you're already heading"},multiplier:{title:"The Multiplier Effect",icon:"✖",description:"AI multiplies your team's output and reach across channels, markets, and skill domains—operating where humans cannot. But when AI goes wrong, it also multiplies errors, misinformation, and poor decisions across the entire organization.",keyPoint:"10× the output · 10× the risk if strategy is flawed"},compounder:{title:"The Compounder Effect",icon:"📈",description:"AI advantages compound over time. Teams building AI systems today gain exponential competitive advantage over rivals still relying on linear human processes. But if built on flawed strategy, AI compounds errors just as relentlessly—pushing organizations toward increasingly costly, irreversible outcomes.",keyPoint:"Exponential advantage or exponential decline—compounding works both ways"}},mirrorPrinciple:{title:"The Mirror Principle",subtitle:"AI Reflects What You Already Are",description:"AI is a mirror of your organization's operating model. It doesn't fix weak strategies—it exposes them faster and at greater scale. The same AI system produces radically different outcomes depending on the quality of the strategy it amplifies.",rule:"AI does not repair weak business strategy. It only makes consequences appear faster—for better or worse.",inputLabel:"Input",outputLabel:"Output",scenarios:{smart:{title:"Smart Organization",emoji:"✅",label:"AI Accelerates Success",input:"Clear positioning, sound processes, quality data, good judgment",output:"Faster clarity, accelerated learning, compounding growth"},mediocre:{title:"Mediocre Organization",emoji:"⚠️",label:"AI Copies Mediocrity",input:"Unclear positioning, average processes, mixed data quality",output:"More output, but not necessarily more advantage"},defective:{title:"Defective Organization",emoji:"❌",label:"AI Amplifies Failure",input:"Flawed positioning, broken processes, poor data, weak judgment",output:"Faster failure, amplified waste, compounded internal friction"}}},aiParadigms:{title:"Two AI Paradigms",subtitle:"Understanding Language Generators vs. Task Executors",bestForLabel:"Best For",promptingTipLabel:"Prompting Tip",paradigm1:{title:"Language Generator",tools:[{name:"ChatGPT",url:"https://chatgpt.com"},{name:"Google Gemini",url:"https://gemini.google.com"},{name:"DeepSeek",url:"https://www.deepseek.com"}],bestFor:["Brainstorming and strategic ideation","Long-form writing: reports, analysis, narrative articles","Interpretation and expansion within long conversation threads","More economical alternative to IDE-embedded agents"],promptingTip:"Detailed, conversational, context-rich prompts → richer, more comprehensive output"},paradigm2:{title:"Task Executor",tools:[{name:"Claude AI",url:"https://claude.ai"},{name:"Manus AI",url:"https://manus.im"},{name:"Cursor Agents",url:"https://cursor.com"}],bestFor:["Autonomous execution of multi-step workflows","Coordinating tools, APIs, files, and systems","Programming, automation, and agentic operations","Tasks with clear end states"],promptingTip:"Concise, task-focused, explicit output format → maximizes agent output quality"}},caseStudies:{title:"Real-World Case Studies",subtitle:"How AI amplifies both success and failure",scenarioLabel:"Scenario",outcomeLabel:"Outcome",lessonLabel:"Core Business Lesson",case1:{title:"Case Study #1: Competitive Attack Content × AI Batch Production",scenario:"A marketing team deployed AI to batch-produce attack-competitor content across LinkedIn and social channels. However, the underlying strategy had already triggered strong industry backlash.",outcome:"The more content they produced with AI, the more the negative effects amplified. More content ≠ more influence—it became larger-scale damage.",lesson:"If your strategy is already triggering backlash, using AI to produce more content only magnifies the problem tenfold. Wrong direction × faster speed = faster failure."},case2:{title:"Case Study #2: Premium Product Meets Negative Brand Association",scenario:"A high-quality product or executive becomes associated with a negatively perceived brand. AI-generated content then amplifies the wrong signal at massive scale.",outcome:"The product's strong track record and real customer value cannot overcome the brand association barrier. More AI content = faster rejection from key market segments.",lesson:"AI content amplifies existing perceptions—both positive and negative. A strong product attached to a weak brand signal will see AI accelerate the rejection, not overcome it."}},useCases:{title:"Where AI Creates Leverage",subtitle:"Business functions where AI delivers maximum value",sales:{title:"Sales",cases:["Customer research and discovery","Call preparation and strategy","Follow-up email drafting","Objection handling and rebuttals"]},marketing:{title:"Marketing",cases:["Message testing and validation","Audience segmentation and targeting","Content variant generation","Campaign ideation and strategy"]},operations:{title:"Operations",cases:["Process documentation and summarization","SOP (Standard Operating Procedure) drafting","Knowledge retrieval and management","Workflow automation and optimization"]},product:{title:"Product",cases:["User feedback integration and analysis","Roadmap assumptions and validation","Feature prioritization and ranking","Product strategy refinement"]},qa:{title:"QA",cases:["Test framework and skeleton generation","Edge case identification","Regression testing strategy","Defect summarization and reporting"]},competitiveIntelligence:{title:"Competitive Intelligence",cases:["Market scanning and monitoring","Scenario planning and forecasting","Competitor positioning analysis","Industry trend identification"]}},promptingGuide:{title:"Strategic Prompting Guide",subtitle:"Eliciting Honest, High-Quality AI Output",introduction:"The best AI results come from asking the right strategic questions—not just requesting content production. Here's how to prompt for genuine insight.",keyInsight:"Request honest, clear strategic judgment from AI—not content production. This is where AI's true value emerges.",doLabel:"✓ DO",dontLabel:"✗ DON'T",examples:[{correct:"What customer needs are we currently overlooking?",incorrect:"Write a product launch press release"},{correct:"Which strategic bets have the highest impact-to-investment ratio?",incorrect:"Generate 20 social media posts for our brand"},{correct:"Where are we most vulnerable to competitive disruption?",incorrect:"Draft attack content against competitors"},{correct:"Be honest: what are the blind spots in our strategy?",incorrect:"Write 10 email templates for the sales team"},{correct:"What are the most viable quick-win opportunities in the next 90 days?",incorrect:"Create a Q3 investor newsletter"}]},vibeCoding:{title:"Vibe Coding: AI-Augmented Development",subtitle:"Using AI to amplify coding productivity and quality",description:"Vibe Coding is the practice of using AI as a collaborative partner to amplify development velocity, code quality, and problem-solving capability. Rather than replacing developers, AI augments their judgment and accelerates their output.",usefulTip:`**Useful Tip:** Always develop a fully functioning application skeleton using an agentic tool (such as [Manus AI](https://manus.im/) or [Claude AI](https://claude.ai/)), a canvas/AI coding tool ([Google Gemini Canvas](https://gemini.google.com/canvas), [ChatGPT Canvas](https://chatgpt.com/)), or even ask [DeepSeek](https://deepseek.com/) to write a Single Page Application skeleton that is downloadable or runnable on the Web. Then, download the entire application source code to further vibe-code, refactor and expand the application features using different AI models' IDE plugins or extensions ([Antigravity](https://antigravity.google/), [VS Code MS Copilot](https://github.com/features/copilot), [VS Code Codex Extension](https://openai.com/codex/), etc.). This allows the AI to fully leverage its "Compounding Effect" on a solid foundation, rather than attempting to generate every feature you envision in the absence of sufficient context, data, or system development and design details.`,tools:{title:"Real-World AI Tools in Action",bugGenie:{name:"BugGenie AI",subtitle:"Bug Ticket Drafting tool driven by [Google Gemini's built-in Canvas feature](https://gemini.google.com/canvas)",description:"Transforms screenshots and supporting artifacts into structured, professional bug reports directly in the browser—no backend or installation required.",features:["Driven by [Google Gemini's Canvas feature](https://gemini.google.com/canvas) or via [Google AI Studio's Build Apps](https://aistudio.google.com/apps) feature","Browser-based—no install, no build step","Accepts screenshots & supporting artifacts","Outputs structured, ready-to-file bug tickets"],githubLink:{label:"Github Source Code",url:"https://github.com/hockchiyeer/ai-powered-auto-bug-ticket-logger"},aiStudioLink:{label:"Google AI Studio-enabled Application",url:"https://aistudio.google.com/apps/ce12cbda-aa17-405d-9018-96a8ef249d29?showPreview=true&showAssistant=true"},canvasLink:{label:"Google Gemini Canvas-enabled Application",url:"https://gemini.google.com/share/5a9916e135f0"}},agileMaturity:{name:"Agile Maturity Assessment App",subtitle:"Browser-Native Static JavaScript Application",description:"A fully self-contained assessment app that runs by opening index.html—no build step, no package install, no dev server required.",features:["100% browser-native—pure HTML, CSS & JS","Zero-dependency: no npm, no bundler, no server","Open index.html directly to run locally","Deployable to GitHub Pages in one step"],githubLink:{label:"Github Source Code",url:"https://github.com/hockchiyeer/google-ai-studio-generated-agile-maturity-assessment-app"},appLink:{label:"Application",url:"https://hockchiyeer.github.io/google-ai-studio-generated-agile-maturity-assessment-app"}}},toolRankings:{title:"AI Tool Rankings for Coding Tasks",subtitle:"Efficiency, accuracy & output quality (personal experience)",tools:[{rank:1,name:"OpenAI Codex - GPT-5.5 Ultra High Thinking",score:"9.0/10",url:"https://openai.com/codex/"},{rank:2,name:"Google Antigravity - Claude Sonnet 4.6 High Thinking",score:"7.8/10",url:"https://antigravity.google/"},{rank:3,name:"Cursor Agents",score:"6.8/10",url:"https://cursor.com/agents"},{rank:4,name:"GitHub Copilot Free - GPT-4.1 mini model",score:"5.8/10",url:"https://github.com/features/copilot"},{rank:5,name:"Google Antigravity - Gemini Pro 3.1 High Thinking",score:"5.6/10",url:"https://antigravity.google/"}]}},strategicInsights:{title:"The Critical Strategic Question",subtitle:"Reframe competitive advantage through AI capacity reallocation",question:"If your team completely stopped spending time on reactive tasks—responding to competitor announcements, generating routine reports, managing low-value communications—and redirected that freed capacity to AI-augmented strategic work, what investment opportunities would you pursue?",insight:`This question is often closer to the real source of competitive advantage than: "How do we respond to our competitor's latest product launch?"`,keyPoint:"The real competitive advantage lies not in doing more, but in redirecting human capacity from reactive work to strategic thinking—amplified by AI."},subtractPrinciple:{title:"The Subtract Principle",subtitle:"When AI spirals, reset—don't amplify",description:"When an AI trajectory becomes unproductive or misaligned, the solution is not to apply more compute or push harder. Instead, reset to a clean state, switch models, or inject fresh perspective.",corePrinciplesLabel:"Core Principles:",principles:["More compute on a flawed trajectory is brute-force in the wrong direction","Reset to clean state when AI output quality degrades","Switch models to gain fresh perspective and approach","Inject human judgment to redirect the trajectory","Recognize when amplification is making things worse, not better"]},keyTakeaways:{title:"Key Takeaways",subtitle:"Core principles for AI deployment success",takeaways:[{icon:"⚡",title:"AI Is an Amplifier—Direction Matters Most",description:"AI doesn't determine outcome—your strategy does. Correct strategy gets amplified to produce outsized returns. Flawed strategy gets amplified to accelerate failure. Fix direction first."},{icon:"✖",title:"The Multiplier Works Both Ways",description:"Every AI deployment is a force multiplier. Mass-producing flawed messaging at scale is not strength—it is weakness at volume. Strategic clarity multiplied by AI is the only path to durable advantage."},{icon:"📈",title:"The Compounder Rewards Early Movers",description:"AI advantages compound via data, workflow, and speed moats. Teams building AI systems today create leads that late adopters cannot close—regardless of budget."},{icon:"◆",title:"Own the Strategy—Use AI to Accelerate",description:"Generate frameworks, retrieve knowledge, analyze data, and scale execution with AI. But always own the strategic logic, core assumptions, and quality bar yourself."},{icon:"−",title:"The Subtract Principle: Reset, Not Amplify",description:"When AI spirals—reset to clean state, switch models, inject fresh perspective. More compute on a flawed trajectory is brute-force in the wrong direction."}]},aiJourney:{title:"Your AI Journey",subtitle:"Starts here",tagline:"Not by using AI to say more, but by using AI to see more clearly what you are actually doing",steps:[{step:1,title:"Amplify",description:"the right strategy"},{step:2,title:"Multiply",description:"effective execution"},{step:3,title:"Compound",description:"competitive advantages"}],cta:"Start your transformation today",author:"Er Hock Chiye | AI Use Case Practitioner"},crossModelValidation:{title:"Cross-Model Validation Workflow",subtitle:"Reducing hallucinations and expanding context with [Google NotebookLM](https://notebooklm.google.com/)",description:"Never stop at a single AI model's conclusion. Use the same prompt across multiple models to cross-validate and synthesize deeper insights.",steps:[{title:"Establish Baseline",description:"Build an initial knowledge base by importing PDFs, reports, and data into NotebookLM."},{title:"Parallel Testing",description:"Send the identical prompt to multiple models (e.g., [ChatGPT](https://chatgpt.com/), [Gemini](https://gemini.google.com/), [Claude](https://claude.ai/), [DeepSeek](https://deepseek.com/), [Qwen](https://chat.qwen.ai/))."},{title:"Synthesize & Align",description:"Export the responses and import them back into NotebookLM to summarize agreements and pinpoint divergence."},{title:"Final Judgment",description:"Use the consolidated insights to form a robust strategy—always retaining human accountability."}]},aiRedTeaming:{title:"AI Red Teaming",subtitle:"Let AI play your competitor's CEO",description:"Force AI to find the vulnerabilities you are most likely to be exploited on, before your competitors do.",questions:["If our top competitor launched an aggressive campaign next quarter, what would be their most destructive angle?","What are the top 3 undefended weaknesses a well-funded rival could exploit right now?","Which market segment is most vulnerable to being poached by a competitor's offer?","What are the strategic assumptions we hold that are most likely to be wrong?"]},productionObservations:{title:"4 Key Observations from AI in Production",subtitle:"Hard-earned lessons from long-term, multi-model AI deployment",observations:[{title:"Requirement Drift",description:"Context fragments over long threads. Models deviate from the initial strategic goal. Always reset to first principles."},{title:"Not Optimized for Quality",description:"Models confidently produce flawed logic. Establish explicit human validation for high-stakes decisions."},{title:"Breadth Without Depth",description:"AI outputs offer impressive coverage but miss critical edge cases that determine real-world success."},{title:"The Delegation Trap",description:"Outsourcing strategy to AI might yield fast results, but speed without accuracy is a liability."}]},aiMoats:{title:"Building Long-Term AI Moats",subtitle:"The compounding effect of early AI adoption",description:"AI advantages compound over time. Early movers build data and workflow moats that late adopters cannot overcome, regardless of budget.",timeline:[{period:"Months 1-3",title:"Adoption",description:"Deploying tools, building prompt libraries, and capturing early efficiency gains."},{period:"Months 4-6",title:"Integration",description:"AI becomes embedded in core processes. Organizational knowledge begins to compound."},{period:"Months 7-12",title:"Systematization",description:"AI systems feed each other. Customer data refines product strategy; sales data informs marketing."},{period:"Year 2+",title:"Compounding",description:"Exponential data moats and self-reinforcing feedback loops are established."}]},pptShowcase:{title:"Slide Decks on AI Applications",subtitle:"Bilingual previews and downloads",description:"Three example slide decks demonstrating how a single AI application framework transfers across testing, politics, and business strategy.",conclusionText:"In the era of increasingly abundant compute, models, and knowledge resources, mastering an AI application framework often allows rapid migration across multiple industries and domains.",caseLabel:"Case",caseExample:"Test Automation → Politics Maneuver → Business Strategy",items:[{id:"amplifier",filename:"AI_As_Amplifier_Multiplier_Compounder_Chinese_version_35_slides.pptx",title:"AI as Amplifier — Chinese Edition",caption:"In an era of abundant compute, models, and knowledge resources, mastering one AI application framework allows rapid transfer across many industries and domains."},{id:"testing",filename:"AI_in_Software_Test_Automation_ByErHockChiye.pptx",title:"AI in Software Test Automation",caption:"Practical applications of AI in software test automation, with an example of framework transfer."},{id:"politics",filename:"AI政治策略课程_完整版.pptx",title:"AI Political Strategy Course",caption:"AI application cases and a strategy framework for elections and political-organization mobilization."}],preview:"Preview",download:"Download"},footer:{aboutTitle:"About This Site",aboutText:"This educational resource explores how AI amplifies organizational capabilities—for better or worse. The strategic principles presented here are drawn from real-world case studies and best practices in AI deployment.",keyTakeaway:"Key Takeaway",keyTakeawayText:"AI doesn't make you smarter. It amplifies what you already do. The question isn't whether to use AI—it's whether your strategy is strong enough to be amplified."}},zh:{nav:{home:"首页",threeEffects:"三大效应",mirrorPrinciple:"镜像原理",aiParadigms:"AI范式",caseStudies:"案例研究",useCases:"应用场景",promptingGuide:"提示指南",vibeCoding:"敏捷编码",strategicInsights:"战略洞察",crossModelValidation:"交叉验证",aiRedTeaming:"红队分析",productionObservations:"实战观察",aiMoats:"AI 护城河",keyTakeaways:"核心要点",pptShowcase:"幻灯片",subtractPrinciple:"减法原理",aiJourney:"AI 之旅",language:"English"},hero:{mainHeading:"AI 作为放大器、倍增器与复利器",subheading:"AI 如何放大你的竞争优势——或加速你的战略失误。",description:"在算力充裕的时代，AI 不会让你变得更聪明。它只会放大你已经在做的事——无论好坏。学习如何将 AI 作为战略倍增器，同时避免那些将竞争优势转化为复利失败的陷阱。",cta:"探索三大效应"},threeEffects:{title:"AI 部署的三大效应",subtitle:"AI 如何放大、倍增并复利你的组织能力",amplifier:{title:"放大器效应",icon:"⚡",description:"AI 放大每一个行动的影响——无论好坏。正确的战略会产生超额回报；有缺陷的战略则会加速失败。AI 不会创造战略；它只会暴露并放大你原本已有的战略。",keyPoint:"更快 · 更便宜 · 更高效——沿着你已经前进的方向"},multiplier:{title:"倍增器效应",icon:"✖",description:"AI 能倍增团队在各渠道、市场和职能领域的有效产出与覆盖范围——在人力无法兼顾之处同时运作。但当 AI 出错时，也会在整个组织中复制错误、错误信息和糟糕的决策。",keyPoint:"产出增加 10 倍 · 如果战略有缺陷，风险也增加 10 倍"},compounder:{title:"复利器效应",icon:"📈",description:"AI 带来的优势会随时间复利累积。今天构建 AI 系统的团队，将比仍依赖线性人工流程的竞争对手获得指数级领先优势。但若建立在有缺陷的战略之上，AI 同样会让错误随时间复利累积，把组织推向代价越来越高、越来越难以逆转的结局。",keyPoint:"指数级优势或指数级衰退——复利在两个方向都起作用"}},mirrorPrinciple:{title:"镜像原理",subtitle:"AI 反映你已有的样子",description:"AI 是你组织运作模式的一面镜子。它不会修复薄弱的商业战略，它只会让后果更快显现——无论好坏。同样的 AI 系统根据它放大的战略质量而产生截然不同的结果。",rule:"AI 不会修复薄弱的商业战略。它只会让后果更快显现——无论好坏。",inputLabel:"输入",outputLabel:"产出",scenarios:{smart:{title:"聪慧组织",emoji:"✅",label:"AI 加速成功",input:"清晰定位、健全流程、优质数据、良好判断",output:"更快的清晰度、加速学习、复利增长"},mediocre:{title:"平庸组织",emoji:"⚠️",label:"AI 复制平庸",input:"模糊定位、平均流程、混合数据质量",output:"更多产出，但不一定带来更多优势"},defective:{title:"有缺陷的组织",emoji:"❌",label:"AI 放大失败",input:"有缺陷的定位、破碎流程、劣质数据、薄弱判断",output:"更快失败、放大浪费、复合内部摩擦"}}},aiParadigms:{title:"两种 AI 范式",subtitle:"理解语言生成器与任务执行者",bestForLabel:"最佳应用场景",promptingTipLabel:"提示词技巧",paradigm1:{title:"语言生成器",tools:[{name:"ChatGPT",url:"https://chatgpt.com"},{name:"Google Gemini",url:"https://gemini.google.com"},{name:"DeepSeek",url:"https://www.deepseek.com"}],bestFor:["头脑风暴与战略构思","长篇写作：报告、分析、叙述性文章","在长对话线程中进行解读与扩展","比 IDE 内置智能体更经济的替代方案"],promptingTip:"详细、对话式、上下文丰富的提示 → 更丰富、更全面的输出"},paradigm2:{title:"任务执行者",tools:[{name:"Claude AI",url:"https://claude.ai"},{name:"Manus AI",url:"https://manus.im"},{name:"Cursor Agents",url:"https://cursor.com"}],bestFor:["自主执行多步骤工作流","协调工具、API、文件与系统","编程、自动化与智能体操作","具有明确终态的任务"],promptingTip:"简洁、聚焦任务、明确输出格式 → 最大化智能体输出质量"}},caseStudies:{title:"真实案例研究",subtitle:"AI 如何放大成功与失败",scenarioLabel:"情境",outcomeLabel:"后果",lessonLabel:"核心商业启示",case1:{title:"案例研究 #1：竞争对手攻击型内容 × AI 批量生产",scenario:"某企业营销团队部署 AI，在领英及社交渠道上批量生产攻击竞争对手的内容。而其底层战略本身已经引发了业内的强烈反弹。",outcome:"他们用 AI 生产得越多，负面效应只会被放大十倍。更多内容不等于更多影响力——而是更大规模的损害。",lesson:"如果你的战略本就已经引发反弹，用 AI 生产得越多，负面效应只会被放大十倍。方向错误 × 速度更快 = 更快走向失败。"},case2:{title:"案例研究 #2：优质产品遭遇负面品牌联想",scenario:"一个优质产品或高管与一个负面感知的品牌产生关联。AI 内容会把错误的信号大规模放大。",outcome:"产品出色的业绩记录和真实的客户价值无法克服品牌联想障碍。更多 AI 内容 = 关键细分群体更快拒绝。",lesson:"AI 内容放大现有认知——无论积极还是消极。一个强产品附带弱品牌信号将看到 AI 加速拒绝，而不是克服它。"}},useCases:{title:"AI 创造杠杆的地方",subtitle:"AI 价值最大的业务职能",sales:{title:"销售",cases:["客户调研与发现","通话准备与策略","跟进邮件起草","异议处理与反驳"]},marketing:{title:"市场营销",cases:["信息测试与验证","受众细分与定位","内容变体生成","活动创意与策略"]},operations:{title:"运营",cases:["流程文档与总结","SOP（标准操作程序）起草","知识检索与管理","工作流自动化与优化"]},product:{title:"产品",cases
