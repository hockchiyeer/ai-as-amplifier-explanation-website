nd hover:bg-secondary/80",ghost:"hover:bg-accent dark:hover:bg-accent/50",link:"text-primary underline-offset-4 hover:underline"},size:{default:"h-9 px-4 py-2 has-[>svg]:px-3",sm:"h-8 rounded-md gap-1.5 px-3 has-[>svg]:px-2.5",lg:"h-10 rounded-md px-6 has-[>svg]:px-4",icon:"size-9","icon-sm":"size-8","icon-lg":"size-10"}},defaultVariants:{variant:"default",size:"default"}});function li({className:n,variant:i,size:r,asChild:l=!1,...o}){const c=l?yS:"button";return y.jsx(c,{"data-slot":"button",className:qt(JT({variant:i,size:r,className:n})),...o})}const $T={amplifier:JSON.parse('{"file":"AI_As_Amplifier_Multiplier_Compounder_Chinese_version_35_slides.pptx","count":35,"slides":[{"n":1,"title":"企业AI战略","text":["企业AI战略","AI × 企业战略","放大器、倍增器","与复利器","AI如何放大、倍增并复利你的竞争优势","——以及你的战略失误","余福祺  |  AI日常用例实践者"]},{"n":2,"title":"AI对企业的三大复合效应","text":["AI对企业的三大复合效应","组织中的每一次AI部署,都同时通过三种相互关联的机制运作。","⚡","效应一","放大器","AI会放大每一个行动的影响——无论好坏。正确的战略会产生超额回报;有缺陷的战略则会加速失败,并放大其后果。","✖","效应二","倍增器","AI能倍增团队在各渠道、市场和职能领域的有效产出与覆盖范围——在人力无法兼顾之处同时运作。但当AI出错时,也会在整个组织中复制错误、错误信息和糟糕的决策。","📈","效应三","复利器","AI带来的优势会随时间复利累积。今天构建AI系统的团队,将比仍依赖线性人工流程的竞争对手获得指数级领先优势。但若建立在有缺陷的战略之上,AI同样会让错误随时间复利累积,把组织推向代价越来越高、越来越难以逆转的结局。","这三种效应并非各自独立——它们同时发生,并相互强化。"]},{"n":3,"title":"算力充裕时代:AI创造“一体多面,一法通万法通”","text":["算力充裕时代:AI创造“一体多面,一法通万法通”","在算力、模型与知识资源日益充裕(Abundance of Resources)的时代,掌握一种AI应用框架,往往能够快速迁移到多个行业与领域。","案例:同一套AI应用框架,跨领域变通迁移","AI in Test Automation","软件测试自动化的AI实战","AI in Politics Maneuver","选举与政治组织动员","AI in Business Strategy","企业战略制定与决策辅助","共同底层能力","📥","信息收集与","知识整合","🧩","模式识别与","推理","⚙","工作流程","辅助与优化","🧭","决策辅助与","情景分析","📢","内容生成与","传播优化","关键洞察:掌握一种AI应用框架,往往能够快速变通迁移到多个行业与领域。"]},{"n":4,"title":"镜像原理","text":["镜像原理","AI不会让你变得更聪明","它只会放大你组织现有的运作模式——产生更大的效果。","✅ 聪明的组织","AI加速成功","⚠️ 平庸的组织","AI复制平庸","❌ 有缺陷的组织","AI放大失败","你的运作模式  →  AI × 放大器  →  放大后的结果(×5甚至更多)","🪞 如果方法本身就是错的,AI只会让你更快、更廉价、更大规模地失败。"]},{"n":5,"title":"AI不会创造战略。它只会暴露并放大你原本已有的战略。","text":["AI不会创造战略。它只会暴露并放大你原本已有的战略。","你当前的运作模式","定位 • 流程 • 数据 • 判断","AI","放大后的产出","更快的速度 • 更大的量 • 更广的覆盖 • 更高的可见度","强模式","AI加速清晰度、学习与增长。","平庸模式","AI产生更多产出,但未必带来更多优势。","薄弱模式","AI会放大浪费、混乱与内部摩擦。","规律","AI不会修复薄弱的商业战略,它只会让后果更快显现——无论好坏。","AI:放大器 / 倍增器 / 复利器","镜像效应"]},{"n":6,"title":"放大器效应——双向法则","text":["放大器效应——双向法则","❌ 有缺陷的战略 × AI","=  加速走向失败","更快  ·  更便宜  ·  更高效地错","倍增效应(负向)","错误的品牌信息被放大传播给10倍的受众","糟糕的产品定位被推送到每一个细分市场","有缺陷的定价策略被快速复制到所有SKU","负面品牌联想通过AI内容病毒式传播","引发反弹的竞争对手攻击——如今规模化发生","✅ 正确的战略 × AI","=  指数级的竞争优势","精准  ·  高影响力  ·  物超所值","倍增效应(正向)","经验证的价值主张扩展到10倍的潜在市场","成功的客户洞察被应用到每一条产品线","高效销售话术以零边际成本被复制","突破性定位复利累积为持久的品牌资产","客户情报持续反哺、不断改进AI循环","VS"]},{"n":7,"title":"正确的起点:先有战略,后有执行","text":["正确的起点:先有战略,后有执行","运用AI的第一步,不是生产内容或执行任务——而是提出正确的战略问题。","❌ 多数组织如何使用AI","“写一份产品发布新闻稿”","“为我们的品牌生成20条社媒帖文”","“为领英起草攻击竞争对手的内容”","“为销售团队制作10份邮件模板”","“为这条产品线做一份提案演示文稿”","“写我们的Q3投资者通讯”","✅ 领导者应该如何开始","“我们现在正在忽视哪些客户需求?”","“哪些战略押注的影响力/投入比最高?”","“我们最容易受到竞争颠覆的地方在哪里?”","“老实告诉我,我们的战略有哪些盲点。”","“未来90天内最可行的速赢机会是什么?”","“哪些被忽视的资产能保护我们的利润底线、放大我们的议价能力,我们又该如何严谨地衡量其价值与投资回报?”","“哪些未被充分利用的资源能为我们的核心业务提供缓冲、增强我们的谈判筹码,我们又该如何准确衡量其财务回报?”","VS","要求AI给出诚实、清晰的战略判断,才是正确的第一步——而不是生产内容。"]},{"n":8,"title":"两种AI范式——先弄清楚你用的是哪一种","text":["两种AI范式——先弄清楚你用的是哪一种","最佳的提示方式,完全取决于这个AI是“语言生成器”还是“任务执行者”。","语言生成器","基于对话的聊天机器人","ChatGPT  ·  Google Gemini  ·  DeepSeek","最适合:","头脑风暴与战略构思","长篇写作:报告、分析、叙述性文章","在长对话线程中进行解读与扩展","比IDE内置智能体更经济的替代方案","提示技巧:详细、对话式、上下文丰富的提示 → 更丰富、更全面的输出","任务执行者","基于任务的智能体AI","Claude AI  ·  GitHub Copilot  ·  Cursor Agents","最适合:","自主执行多步骤工作流","协调工具、API、文件与系统","编程、自动化与智能体操作","具有明确终态的任务","提示技巧:简洁、聚焦任务、明确输出格式 → 最大化智能体输出质量"]},{"n":9,"title":"实用AI工具选择:让工具匹配任务","text":["实用AI工具选择:让工具匹配任务","你怎么提示,就得到什么结果。工具与任务类型不匹配,是最常见、也最昂贵的AI错误之一。","1","用聊天型大语言模型做头脑风暴与长篇写作——而非智能体工具","聊天型大语言模型(ChatGPT、Gemini)回答头脑风暴与战略规划问题,比IDE内置智能体更经济。在同等输出质量下,IDE编程智能体会产生更高的token成本和许可费用。","2","给任务执行者简洁、任务清晰的提示——而非对话式聊天","Claude AI及其他智能体模型是任务执行者,而非文本生成器。明确界定的任务定义能最大化结果;过于详细的对话式上下文会稀释任务焦点,降低输出质量。","3","在确定性不可妥协的场景中,优先采用规则化逻辑","在金融、合规、安全和法务等需要可追溯性与零容错的领域,人工编写的规则逻辑更为可靠。应用AI来加速确定性推理,而不是取代它。","4","充分考量规模化下的数据质量、计算成本与安全风险","大规模应用AI需要充足的高质量数据、算力与能源——同时也容易受到提示注入和对抗性输入的攻击。务必将风险缓解机制纳入你的AI部署战略。","结论:让工具匹配任务类型。AI负责加速——但战略、逻辑与质量标准必须由人来掌控。"]},{"n":10,"title":"大语言模型是基于token的文本预测器——不是逻辑计算引擎。要善用它们的强项:编写确定性的代码。","text":["大语言模型是基于token的文本预测器——不是逻辑计算引擎。要善用它们的强项:编写确定性的代码。","✘ 错误的做法","✓ 正确的做法","Σ","“4,823的17%是多少?”","直接让AI进行计算。结果:看似合理,但可能是错的。","Aa","“STRAWBERRY这个单词里有几个R?”","让AI数字符来测试其智能。结果:大语言模型预测的是token,不是字符。","{ }","“写一个Python计算器函数”","AI编写出确定性的代码,每次都能以100%的准确率完成任何计算。","f(x)","“写一个能统计任意字母的脚本”","AI编写出一个可复用的脚本,能完美统计任意单词、句子或文章中的任意字符。","VS","VS","⚡","关键洞察:  大语言模型擅长编写确定性的Python代码,以完美的准确率处理计数与数学运算——交给它的应该是逻辑,而不仅仅是答案。","指示AI构建工具——而不是直接执行任务"]},{"n":11,"title":"AI真正的商业价值,远不止内容生成","text":["AI真正的商业价值,远不止内容生成","最强大的AI应用不是内容工厂——而是战略情报放大器。","🎤","高管教练","AI辅助的演讲教练能提升表达质量、节奏与说服力——并在整个领导梯队中规模化推广。","🔍","战略分析师","客观分析市场数据、客户情绪与竞争对手的弱点——挖掘出人类模式识别容易遗漏的洞察。","🎯","信息测试器","对价值主张、产品话术与行动号召进行A/B测试,精准找出最能引起每个目标群体共鸣的内容。","📊","市场情报","实时追踪竞争对手动向、行业情绪与新兴市场变化——在颠覆来临前提前预警。","🧠","盲点揭示者","指示AI扮演反方意见者或不满意的客户——揭露领导层一直忽视的关键战略问题。","🔄","运营倍增器","自动化重复性的商业智能流程、报告生成与数据丰富化工作——把人才解放出来,投入需要高判断力、不可替代的工作。","AI最大的价值不是产出更多内容——而是帮助领导层发现自己实际在做什么。"]},{"n":12,"title":"在需要速度、广度与综合判断的地方,AI的价值最大。","text":["在需要速度、广度与综合判断的地方,AI的价值最大。","销售","客户调研、通话准备、跟进文案起草、异议处理。","市场营销","信息测试、受众细分、内容变体、campaign创意。","运营","流程总结、SOP起草、知识检索、工作流自动化。","产品","用户反馈整合、路线图假设、功能优先级排序。","质量与测试","测试骨架、边界场景、回归分级、缺陷总结。","竞争情报","市场扫描、情景规划、竞争对手定位。","应记住的模式","用聊天机器人做构思、分析和长篇思考;用AI智能体处理边界清晰的任务;确定性规则与审批关卡始终由人来掌控。","加速那些受益于综合整理的工作。","AI在哪些地方为商业创造杠杆"]},{"n":13,"title":"根本性的差距","text":["根本性的差距","AI是其训练数据的镜子","AI擅长生成产出","大语言模型是在浩瀚的人类知识库上训练而成的,这些知识库本就以创作与生成为重。它们擅长产出初稿、分析框架、代码骨架和高管摘要。","✓ 在生成、构思与重构方面表现出色","在验证与精确性方面表现欠佳","AI是其训练数据的一面镜子。由于整个行业在验证文化上的投入本就不足,大语言模型也继承了同样的偏差——产出的内容可能流于浅表、脆弱,或悄无声息地出错。","✗ 在确定性、可验证的产出方面表现薄弱","在任何零容错的领域——金融合规、安全攸关的系统、法律文件——AI的概率性本质是一种负担,而非优势。验证工作必须由人来掌控。"]},{"n":14,"title":"案例研究#1——错误战略 × AI = 加速失败","text":["案例研究#1——错误战略 × AI = 加速失败","场景:竞争对手攻击型内容战略 × AI批量生产","某企业营销团队部署AI,在领英及社交渠道上批量生产攻击竞争对手的内容。而其底层战略本身已经引发了业内的强烈反弹。","😤","攻击性","话术战略","×","🤖","AI批量","生产","=","🔥","放大的","反弹","📌 核心商业教训","如果你的战略本就已经引发反弹,用AI生产得越多,负面效应只会被放大十倍。更多内容不等于更多影响力——而是更大规模的损害。","更多 ≠ 更好。方向错误 × 速度更快 = 更快走向失败。","错误战略 × AI加速 = 加速失败"]},{"n":15,"title":"案例研究#2——品牌联想陷阱","text":["案例研究#2——品牌联想陷阱","一个优质产品或高管,与一个负面感知的品牌产生关联。AI内容会把错误的信号大规模放大。","🏆","优质产品 / 高管","✓ 出色的业绩记录","✓ 真实的客户价值","✓ 可信的过往记录","✅ 市场愿意参与互动","➕","🚫","负面品牌联想","✗ 已经是“拒之门外”的触发因素","✗ 关键细分群体拒绝互动","✗ 负面认知先于评估发生","❌ 潜在客户尚未倾听就已抽身","=","📉","AI让","情况更糟","更多AI内容 =","更快的品牌损害","⚠️ 反向","放大效应","先修复品牌信号。AI跑不赢一个定位问题——它只能加速损害的发生。","重新定位必须先于放大进行。"]},{"n":16,"title":"为什么基于统计的AI与商业逻辑会冲突的4个原因","text":["为什么基于统计的AI与商业逻辑会冲突的4个原因","为什么将关键商业决策完全外包给AI会带来系统性风险——以及人类必须在哪些地方守住底线。","01","确定性规则 与 概率性输出","构建商业流程是确定性的——你来定义规则,执行规则意味着零容错。而大语言模型是以概率方式运作,猜测什么是正确答案。对合规或定价规则的一次错误解读,就会污染下游的一切环节。","02","对现实世界状态零实时感知","AI对你的商业环境没有实时感知。它基于可能已过时数月甚至数年的训练数据快照,自信地给出建议。它无法看到其训练截止日期之后的市场变化、监管调整或竞争对手动向。","03","长决策链中的上下文漂移","复杂的商业决策涉及紧密耦合的链条:收入模型 → 定价 → 利润率 → 激励结构。随着链条变长,AI的上下文会发生漂移——第四步建立在第二步的错误假设之上。输出看似合乎逻辑,但结构上已经出了问题。","04","调试战略性错误的高昂代价","与开发阶段就能被发现的软件缺陷不同,战略性的AI错误会在实际运行中不断累积——侵蚀市场地位、客户信任与财务表现——直到问题才显现出来。反馈周期很长,等错误浮出水面时,代价已经十分高昂。"]},{"n":17,"title":"AI很强大——但并非适用于所有类型的工作。","text":["AI很强大——但并非适用于所有类型的工作。","让AI保持在辅助角色","确定性的定价规则","合规与法务审批","财务管控","发布关卡与质量审批","安全敏感的工作流这些领域需要可审计性与可预测的结果。","软件测试自动化的经验","大语言模型非常擅长生成骨架代码、检索语法和起草变体方案。但在验证选择器、时序、边界场景与根因准确性方面相对薄弱——这些确定性的部分仍然属于人类的职责。","这为何对商业很重要","快但错误的工作流不是竞争优势。决策越敏感,验证逻辑、数据与最终判断就越重要。","AI负责加速。问责始终在人。","人类必须掌控的领域"]},{"n":18,"title":"最大化AI覆盖面:多模型策略","text":["最大化AI覆盖面:多模型策略","聪明的组织不会依赖单一的AI模型——它们会运营一个模型组合,以最大化质量、覆盖面与抗风险能力。","🔄","工具轮换策略","同时维持对多个AI工具的免费版与付费版的使用权限。各工具的额度按不同周期重置。交叉比对多个模型的输出能显著提升质量,并发现单一模型本身就容易遗漏的战略盲点。","🧩","跨模型工作流","当一个模型在复杂问题上卡住时,把上下文粘贴到另一个大语言模型中,进行独立分析。再把它给出的建议带回你的主工作流。这种“洞察注入”技巧能打破僵局,同时不丢失已积累的上下文与项目历史。","📊","多模型验证","对战略规划、财务模型、合规文件等高风险产出,至少用两个独立的AI模型进行验证。这一点对基于文本资料的检索、研究与归纳总结类任务尤为重要——单一模型的推理始终存在局限。建议用同一提示词在多个模型上运行,再复制或导出为Word/PDF文档加以整合比对,以拓宽内容的广度与深度。模型间出现分歧,提示该处需要人工判断;结果一致,则提升置信度。但两者都不能替代管理者对最终决策的所有权。","已在战略、分析、代码、沟通与商业智能等工作流中测试过这些模型。"]},{"n":19,"title":"Google NotebookLM 实战指南:多模型交叉验证工作流","text":["Google NotebookLM 实战指南:多模型交叉验证工作流","不要止步于单一AI模型的总结与结论——用同一提示词在多个模型间交叉验证,才能拓宽内容的广度与深度。","⚠ 单一AI模型局限","推理路径受训练数据限制","检索范围可能存在遗漏","总结过程存在压缩偏差","研究结论可能忽略反方观点","幻觉与事实错误无法完全避免","Google NotebookLM链接:","https://notebooklm.google.com/","六步工作流","1","导入PDF、Word、研究报告、搜素结果等资料至NotebookLM数据源。","3","在NotebookLM右侧的 Studio（工作室）面板中，一键将交叉验证后的更丰富、更全面的数据集生成为精美的最终报告。","2","不要直接接受单一模型结论","4","使用同一Prompt在ChatGPT、Gemini、Claude、DeepSeek等模型重复执行对话。","5","把不同AI模型针对Prompt的文本答案，复制粘贴或导出成为Word/PDF，输入NotebookLM数据源。","6","使用NotebookLM进行总结、研究、问答与洞察提炼 。","比较分歧与共识,提炼更丰富、更全面的结论 。"]},{"n":20,"title":"NotebookLM 的核心优势在于“以资料来源为依据”的分析。将多模型交叉验证(Cross-Model Validation)工作流整合进 notebooklm.google,可彻底打破单一模型的认知盲点,提炼出更客观、全面的深度洞察。","text":["NotebookLM 的核心优势在于“以资料来源为依据”的分析。将多模型交叉验证(Cross-Model Validation)工作流整合进 notebooklm.google,可彻底打破单一模型的认知盲点,提炼出更客观、全面的深度洞察。","第一步 – 第二步:建立基准与原则","1️⃣ 构建初始知识库(基准数据源)","在NotebookLM新建笔记本,导入PDF、Word、研究报告、Markdown;支持YouTube、音频、网页等多模态源;可用内置Discover Sources补充最新网络结果。","2️⃣ 确立“不盲信”原则","核心思维:拒绝直接接受任何单一模型的推论或结论。规避风险:单一模型存在特定语料偏见、逻辑定式或潜在的轻微幻觉。","第三步:多模型并行测试(多脑风暴)— 同一Prompt,同时发给:","第四步 – 第六步:汇总、对齐与提炼","4️⃣ 汇总模型答复","导出/另存为Word·PDF,或直接复制文本,用NotebookLM的“Copy Text”创建新来源。","5️⃣ 启动深度对齐","一键摘要梳理各模型脉络;多源问答“各模型切入点有何不同?”","6️⃣ 提炼共识与分歧","凝练共识为稳固基石,剖析分歧定位灰色地带,在Studio面板一键生成最终报告。","最佳实践: 多模型 + 多来源文档 + 人工验证 = 更高质量研究成果","Google NotebookLM 实战指南:多模型交叉验证工作流","ChatGPT","长文本逻辑推理与框架构建","Gemini","谷歌生态优势,注重多模态关联","Claude","细腻文本语感,深度学术与行业分析","DeepSeek","超高性价比的深度思考与高难度推理","Qwen","卓越中文语境理解，全面开源与多模态生态"]},{"n":21,"title":"AI驱动的战略评估:100问框架","text":["AI驱动的战略评估:100问框架","适用于任何业务单元的结构化诊断工具——输入给AI,用于对照市场现实进行全面的差距分析。","I","客户需求与痛点  Q1–Q10","存在哪些未被满足的需求?哪些细分群体服务不足?最大的满意度差距在哪里?","II","竞争威胁评估  Q11–Q20","哪些细分市场最容易受到颠覆?竞争对手在哪里增长最快?","III","品牌与产品定位  Q21–Q30","客户认同的是品牌还是产品本身?哪些联想会先于评估出现?","IV","客户互动效能  Q31–Q40","满意度与问题解决率如何?哪些渠道带来转化?资源浪费在哪里?","V","资源投资回报与活动效率  Q41–Q50","哪些活动成本最高、回报最低?哪些只是习惯性支出?","VI","数字化与AI准备度  Q51–Q60","团队是被AI增强,还是依赖AI?最大的自动化机会在哪里?","VII","内容与信息共鸣  Q61–Q70","是客户在主动互动,还是只有内部团队在互相转发?什么会触发负面反应?","VIII","组织智能  Q71–Q80","是否有统一的知识库?带分析功能的CRM?风险看板与预警系统?","IX","一线能力与人才接续  Q81–Q90","哪里存在关键人物依赖?核心技能缺口与接续风险在哪里?","X","红队与对抗性分析  Q91–Q100","如果竞争对手发起攻击,最可能的角度是什么?我们最大的三个弱点是什么?","💡 把这100个问题连同公司的市场数据一起喂给AI,要求其输出“客户期望与现实差距分析”。"]},{"n":22,"title":"AI红队分析","text":["AI红队分析","让AI扮演你竞争对手的CEO","在竞争对手之前,强迫AI找出你最容易被利用的弱点。","🔴 如果我们的头号竞争对手下季度发起一场攻势性的campaign,他们最具破坏力的角度会是什么?","🔴 资金充足的对手现在就能利用的三个最该被防守的弱点是什么?","⚠️ 当下哪个市场细分群体最容易被竞争对手的报价拿下?","⚠️ 哪些话题或立场让我们最难公开自辩——为什么?","🎯 新进入市场的对手会用什么不同打法来抢走我们最大的客户群?","🎯 我们正在做的哪些战略假设最有可能是错的?","🔴 把这些问题连同公司的公开数据一起喂给AI——指示它扮演敌对竞争对手的战略总监,找出你最脆弱的三个攻击面。"]},{"n":23,"title":"AI时代的资源重新配置","text":["AI时代的资源重新配置","多数团队把80%的精力花在AI能胜任的工作上——只剩20%留给需要高判断力、高影响力的工作。","团队精力的80%","目前大部分精力流向了这里:","人工编制报告与数据格式化","重复性的竞争监测与数据汇总","起草日常沟通文案、提案与模板","大语言模型能瞬间完成的基础市场调研","会议总结与状态更新的生成","对已有信息进行排版与打包","精力的20%","真正建立竞争","优势的地方:","战略假设的生成","客户洞察的整合","高判断力的决策制定","利益相关方关系建设","AI系统设计与治理","问:当AI吸收了那80%之后,哪些战略投资能再带来1% · 3% · 5% · 10%的额外竞争优势?"]},{"n":24,"title":"来自AI生产环境使用的4个关键观察","text":["来自AI生产环境使用的4个关键观察","在长期、多模型AI辅助的运营与开发工作中得来的宝贵经验。","01","需求会随时间漂移","随着AI交互的累积,上下文会在冗长的提示线程中变得碎片化。模型会逐渐偏离最初的战略目标,引入倒退,并打破与最初需求的一致性。务必时常回到第一原则,并对照最初的问题陈述进行校验。","02","AI模型天生并非为质量而优化","这些模型并非为精确验证而训练或调优。它们会自信地产出有缺陷的分析或错误的结果,并声称已经过充分审查。务必在每一个高风险决策节点上建立明确的人工验证环节。","03","有广度没有深度——浅层输出陷阱","AI的输出往往覆盖面令人印象深刻,却遗漏了决定现实结果的具体边界场景与细微差别。一个漂亮的战略框架,无法替代严谨、深入的领域分析。深度需要独立验证。","04","完全放手的陷阱——有速度没有准确性","把战略与执行都完全交给AI的团队,或许能很快产出结果——但无法保证其正确性或战略上的合理性。速度与准确性不是一回事。外包战略,和委派一项任务,完全不是同一件事。"]},{"n":25,"title":"实战心得","text":["实战心得","护栏需要,但留白同样重要","护栏不可或缺","自2022年底起持续使用ChatGPT等AI模型以来,我体会到:组织需要围绕AI系统构建强健的护栏,以及确定性、规则化的机制,来缓解幻觉问题,以及概率统计模型固有的风险。","✓ 用规则机制管控幻觉与概率性风险","但别管得太死","但同样重要的是,不能把AI管得太死。应时常尝试开放式、非结构化的提示词——这类探索常常让人类与AI都措手不及,却也最容易催生意想不到的洞察、新颖关联与创造性成果。","★ 留白（具有模糊性的开放式语境）,往往催生最意外的洞察","AI真正的价值,不仅在于它能在明确边界内可靠运作,更在于它能揭示出用户与系统事先都未曾预料到的可能性。"]},{"n":26,"title":"减法原则","text":["减法原则","当AI在做加法时,人类必须做减法","在错误的轨道上投入更多算力,只是朝错误方向的暴力蛮干。AI需要的是重置——而不是更多token。","重置到干净状态","当一次AI会话脱离轨道时,恢复到上一个稳定基线——一份干净的需求说明、一个已验证的输出,或一个已知有效的提示词。从坚实的基础重新开始,而不是在已经出问题的基础上继续累积错误决策。","恢复上一个稳定版本  ·  从已知有效的状态重新开始","切换模型,获得全新视角","换一个大语言模型,往往能突破瓶颈。把有问题的上下文粘贴到另一个模型中进行独立分析。这种“局外人视角”能可靠地发现卡住的模型在同一上下文窗口内看不到的问题。","Gemini → Claude → ChatGPT → 重复","把外部洞察带回来","把第三方模型给出的建议带回你的主工作流。这种“洞察注入”技巧能解除停滞会话的阻塞,同时不丢失已经积累的上下文与组织知识。","复制洞察 → 注入主工作流 → 继续推进"]},{"n":27,"title":"复利效应:构建长期的AI护城河","text":["复利效应:构建长期的AI护城河","AI带来的优势并非一成不变——它会复利累积。先行者建立的领先优势,后来者即便投入再多预算也难以追平。","第1–3个月","AI采用","部署AI工具,建立提示词库,搭建初始工作流。小而可见的收益开始显现。","第4–6个月","AI融合","AI被嵌入核心流程,组织知识被沉淀下来,团队能力开始复利累积。","第7–12个月","AI系统化","各AI系统相互反哺。客户数据反哺产品,销售数据反哺内容战略。","第2年以上","AI复利","指数级的数据护城河,自我强化的反馈循环。竞争对手再投入也难以用合理成本追平差距。","数据护城河  ·  历史数据 → 随时间产出更优的AI结果","工作流护城河  ·  嵌入式AI提高了对手的转换成本","速度护城河  ·  周期时间的领先复利累积为市场地位"]},{"n":28,"title":"AI增强型团队的4个实战原则","text":["AI增强型团队的4个实战原则","在生产环境中持续进行多模型AI辅助工作所得来的宝贵经验。","🔄","01  当AI失控时,重置到干净状态","当AI不断累积错误决策时,恢复到上一个稳定的需求说明,而不是继续延伸这条对话线程。在错误轨道上投入更多token,只是朝错误方向的暴力蛮干。","🔀","02  切换模型,获得全新视角","换一个大语言模型,往往能突破瓶颈。把有问题的上下文粘贴到另一个模型中进行独立分析,再把它的洞察带回你的主工作流。","🏗️","03  尽早把核心逻辑打牢","如果早期迭代中的基础战略框架本身就不牢固,即便恢复到稳定基线也会持续累积漂移。AI擅长做原型,但尚不是可靠的战略重构伙伴。","🎯","04  掌控战略——而不只是提示词","用AI来加速分析、框架生成与知识检索——但战略逻辑、关键假设与质量标准,始终要由你自己来掌控。没有正确性的速度,是一种负担。"]},{"n":29,"title":"用一个简单的领导力循环,把AI变成复利优势。","text":["用一个简单的领导力循环,把AI变成复利优势。","1","先明确市场、客户与问题本身。 \\t\\t厘清战略","2","3","4","5","结语","AI不能替代战略。它是清晰度、纪律性与执行力的force multiplier(力量倍增器)。","企业竞争力","让它去挑战假设,揭示你遗漏了什么。 \\t\\t用AI揭示盲点","快速进行实验、比较变体并衡量结果。 \\t\\t用小循环快速测试","把成功的模式转化为模板、检查清单与工作流。 \\t把有效的做法固化下来","战略、判断、风险与最终审批,始终留在团队手中。 \\t确保问责始终在人","一份实用的操作手册"]},{"n":30,"title":"Vibe Coding实战:已构建的AI增强工具","text":["Vibe Coding实战:已构建的AI增强工具","真实世界中AI辅助构建的工具,展示了放大器效应在实践中的体现。它们是为解决真实的测试与生产力问题而搭建的。","(A)","BugGenie AI","由Google Gemini驱动的缺陷工单起草工具","BugGenie AI能把截图和相关材料直接在浏览器中转化为结构化的专业缺陷报告——无需后端,无需安装。","✓ 通过AI Studio由Google Gemini驱动","✓ 基于浏览器——无需安装,无需构建步骤","✓ 支持上传截图与相关材料","✓ 输出结构化、可直接提交的缺陷工单","Github代码链接: github.com/hockchiyeer/ai-powered-auto-bug-ticket-logger","应用链接: aistudio.google.com/apps/ce12cbda-aa17-405d-9018-96a8ef249d29?showPreview=true&showAssistant=true","(B)","敏捷成熟度","评估应用","原生浏览器静态JavaScript应用","一个完全自包含的敏捷成熟度评估应用,只需打开index.html即可运行——无需构建步骤、无需安装包、无需开发服务器、无需任何部署封装。","✓ 100%原生浏览器运行——纯HTML、CSS与JS","✓ 零依赖:无需npm、无需打包工具、无需服务器","✓ 直接打开index.html即可本地运行","✓ 一步即可部署到GitHub Pages","Github代码链接: github.com/hockchiyeer/google-ai-studio-generated-agile-maturity-assessment-app","应用链接: https://hockchiyeer.github.io/google-ai-studio-generated-agile-maturity-assessment-app"]},{"n":31,"title":"AI VIBE CODING生产力工具排名(个人体验)","text":["AI VIBE CODING生产力工具排名(个人体验)","针对 Vibe Coding 任务的效率、准确性与输出质量","排名基于在Java、TypeScript、JavaScript、Python、HTML与PostgreSQL项目中的个人体验","1","GPT-5.5 Ultra High Thinking","9.0 /10","2","Claude Sonnet 4.6 High Thinking","7.8 /10","3","cursor.com/agents","6.8 /10","4","GPT-4.1 mini model","5.8 /10","4","Gemini Pro 3.1 High Thinking","5.6 /10","OpenAI Codex\\t\\t                                                  https://openai.com/codex/","Google Antigravity\\t\\t\\t         https://antigravity.google/","Cursor Agents\\t\\t           https://cursor.com/agents","GitHub Copilot Free\\t     https://github.com/features/copilot","Google Antigravity\\t           https://antigravity.google/"]},{"n":32,"title":"最关键的问题","text":["最关键的问题","只有一个","如果你的团队完全停止把时间花在被动反应式的任务上——回应竞争对手的公告、生成常规报告、处理低价值的沟通工作——","并把释放出来的精力,投入到AI增强的战略性工作中,","哪些投资能带来额外的","1% · 3% · 5% 甚至 10% 的竞争领先优势?","这个问题几乎总是比以下问题,更接近竞争优势的真正来源:","“我们该如何应对竞争对手最新的产品发布?”"]},{"n":33,"title":"核心要点","text":["核心要点","⚡","AI是放大器——方向最重要","AI不会决定结果——你的战略才会。正确的战略被放大,会产生超额回报;有缺陷的战略被放大,会加速走向失败。先把方向修正好。","✖","倍增器是双向的","每一次AI部署都是力量倍增器。大规模生产有缺陷的话术不是力量——而是规模化的弱点。唯有清晰的战略经AI倍增,才是通往持久优势的道路。","▲","复利器奖励先行者","AI的优势通过数据、工作流与速度护城河实现复利累积。今天构建AI系统的团队,会建立起后来者无论投入多少预算都难以追平的领先优势。","◆","掌控战略——用AI来加速","用AI来生成框架、检索知识、分析数据并规模化执行。但战略逻辑、核心假设与质量标准,始终要由你自己掌控。","−","减法原则:重置,而非放大","当AI失控时——重置到干净状态,切换模型,注入新的视角。在错误轨道上投入更多算力,只是朝错误方向的暴力蛮干。"]},{"n":34,"title":"AI:放大器、倍增器与复利器","text":["AI:放大器、倍增器与复利器","AI会强化你企业已经在做的事——无论好坏。","以目标为导向","战略为先","执行在后","用AI来拓宽你的优势——而不是把糟糕的判断自动化。"]},{"n":35,"title":"你的AI之旅","text":["你的AI之旅","从这里开始","不是用AI说更多的话","而是用AI更清楚地看清你究竟在做什么","→ 放大","正确的战略","→ 倍增","有效的执行","→ 复利","竞争优势","Er Hock Chiye  |  AI日常用例实践者","github.com/hockchiyeer"]}]}'),testing:JSON.parse(`{"file":"AI_in_Software_Test_Automation_ByErHockChiye.pptx","count":25,"slides":[{"n":1,"title":"AI in Software","text":["AI in Software","Test Automation","Realities, Limitations & Practical Strategies from the Field","Practitioner Insights  |  Vibe Coding Experience  |  LLMs","Er Hock Chiye","https://github.com/hockchiyeer"]},{"n":2,"title":"Two Paradigms of AI — Know Which One You're Using","text":["Two Paradigms of AI — Know Which One You're Using","The optimal prompting strategy depends entirely on whether the AI is a Language Generator or a Task Executor","Language Generators","Conversation-Based Chatbots","ChatGPT","chatgpt.com","Google Gemini","gemini.google.com","How It Works:","Generates rich, long-form text output","Best suited for reports, narratives,","analysis, commentary & brainstorming","Interprets and expands on conversational","context across a dialogue thread","Prompt tip:  Precise, detailed, conversational prompts → richer output","Task Executors","Task-Based Agentic AI","Claude AI","claude.ai / API","How It Works:","Orchestrates tools, APIs & applications","to complete multi-step workflows","Conversational/verbose prompts reduce","output quality — avoid rambling context","Concise but clearly-defined task prompts","maximise and optimise output quality","Prompt tip:  Concise, task-focused prompts → maximum agentic output"]},{"n":3,"title":"Practical AI Tool Selection: Before You Start","text":["Practical AI Tool Selection: Before You Start","1","Use ChatGPT or Gemini for brainstorming, ideation & long-form writing — not IDE-embedded AI coding agents","IDE coding agents incur higher token costs and licensing fees. LLM chatbots answer the same brainstorming questions more economically.","2","Give Claude concise, task-clear prompts — not long conversational dialogues","Claude AI is a task executor, not a text generator. Detailed but conversational prompts undermine output quality. A well-scoped task definition — not a dialogue — maximises results.","3","Prefer rule-based logic wherever determinism, auditability, and root-cause tracing are non-negotiable","In test automation especially, human-authored rule logic offers clear boundaries and tractable failures. Use ML/LLMs to accelerate — not to replace — deterministic reasoning.","4","When using LLMs at scale, account for data quality, compute cost, and security exposure","Data-driven AI scales only with abundant high-quality data, compute, and energy — while remaining vulnerable to prompt injection and adversarial inputs. Plan risk mitigations accordingly.","Bottom Line: Match your tool to your task type. AI accelerates — but human engineers must own the strategy, logic, and quality bar."]},{"n":4,"title":"Matching Prompt Strategy to AI Type","text":["Matching Prompt Strategy to AI Type","A","Brainstorming & Ideation","Chatbot LLMs (ChatGPT · Gemini · Deepseek","Prompt style: Conversational, exploratory,","open-ended questions with rich detail","Free-tier chatbot LLMs handle ideation, analysis, and long-form generation better than IDE-embedded coding agents — at a fraction of the cost. Token consumption and monthly licensing fees for IDE agents are significantly higher.","✓  Best value for money","B","Long-Form Analysis & Reporting","Prompt style: Detailed, structured, include","background context and desired output format","Precise and detailed prompts unlock the full potential of language generators — the richer the context you supply, the more accurate, thorough, and well-structured the output will be. Iterate via follow-up messages.","✓  Depth over brevity","C","Coding, Automation & Agentic Tasks","Agentic AI (Claude · Copilot · Codex)","Prompt style: Concise, task-clear, specific","output format — avoid verbose chat context","Agentic AI executes tasks autonomously across tools and files. Overly conversational prompts dilute task focus. Define the desired end-state clearly and briefly — let the agent reason about the steps to get there.","✓  Clarity over verbosity","⚠  Do NOT use IDE-embedded coding agents for brainstorming — token consumption and licensing fees are expensive; free chatbot LLMs answer ideation questions faster and more cost-effectively.","Chatbot LLMs (ChatGPT · Gemini · Deepseek)"]},{"n":5,"title":"The Fundamental Gap: AI as a Mirror of Its Training Data","text":["The Fundamental Gap: AI as a Mirror of Its Training Data","AI Excels At Writing Code","LLMs are trained on vast software communities that prioritize building features — not testing them. They excel at 0-to-1 code generation, unit test stubs, and pure functions.","✓  Strong at feature development & refactoring","Struggles with Testing Its Own Code","AI is a mirror of its training data. Because real-world communities underinvest in test culture, LLMs inherit that same bias — producing tests that are shallow, fragile, or outright broken.","✗  Weak at producing reliable automated tests"]},{"n":6,"title":"The Painful Reality","text":["The Painful Reality","5 min","→","2 hrs","AI excels at standard code generation. For UI automation — which demands absolute determinism with zero margin for error — AI's probabilistic nature becomes a liability, not an asset.","AI writes the code","selectors · assertions · steps","Confident. Fast. Unverified.","Human debugs the fallout","DevTools · CI re-runs · selector hunts","Tedious. Manual. Expensive."]},{"n":7,"title":"UI Test Automation:","text":["UI Test Automation:","Why Does It Cost 3–5× More Than Building the Feature?","3–5×","Longer than feature development","time spent on AI-generated","UI automation scripts","The Outsider's Assumption:","\\"If AI can write business logic, writing a test should be a breeze.\\"","The Production Reality:","UI automation demands absolute determinism — zero tolerance for probabilistic output","Dynamic selectors, async timing, and state chains are invisible to AI's static view","Broken selectors cascade: one bad XPath kills the entire test suite","CI/CD flakiness from hallucinated waits wastes team cycles across sprints"]},{"n":8,"title":"4 Reasons Engineering Logic & LLM Logic Clash","text":["4 Reasons Engineering Logic & LLM Logic Clash","01","Deterministic DOM vs. Probabilistic Logic","Building a frontend is deterministic — you define the rules. Testing it means reverse-engineering a dynamic system. LLMs guess at selectors from dynamic Tailwind classes or deep nested divs. One wrong XPath breaks everything.","02","Zero Runtime Awareness & Async Blindness","The biggest enemies of UI testing are timing and async operations. Human engineers know where to add waitForSelector. AI agents only see static snapshots — generating 'hallucinated waits' that pass locally but cause widespread CI/CD flakiness.","03","Context Drift in Long State Chains","UI automation relies on tightly coupled chains (Login → Click → Fill → Validate). As steps grow, AI context drifts — building step 4 on a flawed assumption from step 3. The resulting script looks logical but is completely nonsensical.","04","High-Latency Debugging Loops","Frontend dev has HMR for instant feedback. Test debugging requires launching a runner, opening a browser sandbox, and replaying every prior step just to validate one tweak. AI's speed advantage is completely eliminated in this slow loop."]},{"n":9,"title":"Practical Playbook: Using LLMs Effectively for Test Automation","text":["Practical Playbook: Using LLMs Effectively for Test Automation","1","Generate Test Skeletons","Query multiple LLMs with the same prompt, then synthesize their outputs into a comprehensive, non-redundant test suite covering diverse scenarios.Example: \\"Create 10 Playwright TypeScript tests for https://example.com\\"","2","Request Specific Syntax on Demand","Use LLMs to retrieve exact command syntax (e.g., Playwright, Cypress, Selenium) rather than memorizing everything.","Example: \\"List typical web page element assertion syntaxes for Playwright TypeScript.\\"","3","Debug and Troubleshoot Failing Tests","Supply the full test script AND the complete error message, delimited by triple quotes, for targeted debugging suggestions that address root cause rather than symptoms.","4","Migrate Between Frameworks","Convert existing Cypress JavaScript tests to Playwright TypeScript — or Playwright to Robot Framework — using a structured one-shot agent migration prompt that decouple all dependencies."]},{"n":10,"title":"Method 1 — Generate Test Skeletons via Multi-LLM Synthesis","text":["Method 1 — Generate Test Skeletons via Multi-LLM Synthesis","Query several LLMs in parallel → consolidate → create a comprehensive, non-redundant suite","Recommended LLM Sources:","OpenAI ChatGPT","chatgpt.com","Google Gemini","gemini.google.com","Perplexity AI","perplexity.ai","Microsoft Copilot","copilot.microsoft.com","Example Prompt:","Create 10 Playwright TypeScript tests","for https://www.example.com.","Cover: navigation, form submission,","auth flows, error states, and responsive","layout across viewport sizes.","Synthesis Strategy:","Run identical prompts across all LLMs simultaneously","Each model surfaces different edge cases and test patterns","Merge unique ideas; discard near-duplicate tests","Use the skeleton as a coverage map, then fill in selectors manually","Deepseek","deepseek.com"]},{"n":11,"title":"Method 2 — Request Specific Syntax on Demand","text":["Method 2 — Request Specific Syntax on Demand","Test automation frameworks offer hundreds of commands. LLMs eliminate documentation hunting — ask for the exact syntax you need, including custom utility functions tailored to your specific scenario.","Wait Syntax Alternative","What is an alternative Playwright TypeScript wait syntax","if \`await page.waitForTimeout(3000);\` fails?","Result:","Gets you networkidle, waitForLoadState, waitForSelector, polling strategies","Assertion Syntax Reference","List typical web page element assertion syntaxes","for Playwright TypeScript.","Result:","Returns toBeVisible, toHaveText, toHaveURL, toHaveCount, toBeEnabled…","Custom Overlay Handler","Write a Playwright TypeScript function to dismiss","multiple overlays sharing class name 'overlay'.","Result:","AI generates a reusable while-loop handler with configurable timeout"]},{"n":12,"title":"Method 3 — Debug Failing Tests with Full Context","text":["Method 3 — Debug Failing Tests with Full Context","Always supply both the test script AND the error message, separated by triple-quote delimiters","(A) Failing Test Snippet:","// Comparison using Regular Expression","await expect(","page.locator(","\\"[class*='countAndSortByArticles']\\",","{timeout: 10000}",")",").toContainText(/^[1-9] Articles$/);","(B) Error Message:","Error: Timed out 5000ms waiting for","expect(locator).toContainText(expected)","Expected: /^[1-9] Articles$/","Received: \\" 5 Articles Sort by:","Name (ascending)","Name (descending)...\\"","Root Cause Analysis:","The locator matches a container that includes both the article count and a dropdown menu. The regex /^[1-9] Articles$/ cannot match because the full string contains additional sort-order text appended to the count.","LLM-Suggested Fix:","// Option 1: Match first text node only","await expect(page.locator(","\\"[class*='countAndSortByArticles']\\"",").first()).toContainText(","/[1-9]\\\\s+Articles/);","// Option 2: Scope to text node",".locator('xpath=./text()[1]')"]},{"n":13,"title":"Method 4 — Framework Migration with AI Agents","text":["Method 4 — Framework Migration with AI Agents","Migration Path A: Cypress → Playwright TypeScript","Source (Cypress JS):","describe('Header check', () => {\\n  beforeEach(() => {\\n    cy.viewport(1920, 1080);\\n    cy.visit(Cypress.env('baseUrl'));\\n  });\\n  it('shows Login', () => {\\n    cy.contains('Login').should('be.visible');\\n  });\\n});","→","Target (Playwright TS):","test.describe('Header check', () => {\\n  test.beforeEach(async ({ page }) => {\\n    await page.setViewportSize({w:1920,h:1080});\\n    await page.goto(process.env.BASE_URL);\\n  });\\n  test('shows Login', async ({ page }) => {\\n    await expect(page.getByText('Login')).toBeVisible();\\n  });\\n});","Migration Path B: Playwright → Pure Native Robot Framework + Python","Please migrate all Playwright tests in this folder to the target RobotFramework repository using pure native","RobotFramework + Python — decoupled from all Playwright dependencies and plugins.","Rectify any existing Robot Framework code that still uses Playwright syntax and remove violating files.","Goal: a modular, maintainable, elegant pure-native RobotFramework + Python repository."]},{"n":14,"title":"AI Coding Tool Rankings","text":["AI Coding Tool Rankings","Based on efficiency, accuracy & meticulousness for vibe coding","1","OpenAI Codex","GPT-5.5 Ultra High Thinking","9/10","2","Google Antigravity","Claude Sonnet 4.6 High Thinking","7.8/10","3","Cursor Agents","cursor.com/agents","6.8/10","4","GitHub Copilot Free","GPT-4.1 mini model","5.8/10","4","Google Antigravity","Gemini Pro 3.1 High Thinking","5.6/10","* Rankings reflect personal experience across Java, TypeScript, JavaScript, Python, HTML & PostgreSQL projects"]},{"n":15,"title":"Maximising Free AI Tools for Vibe Coding","text":["Maximising Free AI Tools for Vibe Coding","Use multiple Apple ID or Gmail accounts to rotate free quotas across models — replenished on 5-day, weekly, or monthly cycles","Tool Rotation Strategy","Create separate Apple ID or Gmail accounts to access free tiers across multiple AI tools simultaneously. Quotas replenish on 5-day, weekly, or monthly cycles depending on the platform.\\n\\nTested languages: Java, TypeScript, JavaScript, Python, HTML, and PostgreSQL. Cross-referencing outputs from multiple models dramatically improves code quality and catches blind spots.","Top Models (Ranked)","1. OpenAI Codex","GPT-5.5 Ultra High Thinking","2. Google Antigravity","Claude Sonnet 4.6 High Thinking","3. Cursor Agents","4. GitHub Copilot Free","GPT-4.1 mini model","Cross-Model Workflow","When one model is stuck, paste the problematic files into a separate chatbot-based LLM for independent analysis. Relay its path suggestions back into your IDE's AI chat to break the deadlock.\\n\\nMulti-model collaboration across: Gemini 2.5 Flash, Gemini 3.1 Pro, Codex 5.4, Antigravity Claude and Opus — running in parallel over 6 weeks of continuous refinement."]},{"n":16,"title":"4 Critical Observations from Production Use","text":["4 Critical Observations from Production Use","After weeks of multi-tool AI-assisted development","01","Requirements Drift Over Time","As interactions accumulate, context fragments across lengthy prompt threads. AI models drift from the original requirements, introducing regressions and breaking traceability.","02","AI Models Are Not Test-Optimized","These models are not trained or tuned for automated testing. They confidently produce broken tests, claiming they are 'thoroughly reviewed and tested.'","03","Shadow Tests — Breadth Without Depth","Compared to the elegant solutions delivered for new features, AI-generated tests are often superficial. They cover happy paths and miss edge cases that matter in production.","04","The Hands-Off Trap","Developers who fully outsource both development and testing to AI may deliver fast — but with no guarantee of system reliability. Speed and correctness are not the same thing."]},{"n":17,"title":"GitHub Copilot: Power Tips & Modes","text":["GitHub Copilot: Power Tips & Modes","Ask Mode","Conversational Q&A","Chat-style interaction for explanations, design discussions, and code reviews — similar to ChatGPT but with IDE context awareness.","Edit Mode","Direct File Authoring","AI writes directly into your files without copy-paste. Creates, modifies, and removes code across multiple files simultaneously.","Agent Mode","Autonomous Execution","Controls the IDE autonomously — planning, generating, and executing across the codebase in stages, requesting human approval at key checkpoints.","Custom Instructions","Store architectural context in .github/copilot-instructions.md. Generate an initial version using Agent mode with a structured analysis prompt.","Improve Context Quality","Open all impacted files or drag-and-drop them into the chat window to give Copilot the deep, specific context it needs for accurate suggestions.","MCP Server Security","An MCP server exposes tools and APIs via the Model Context Protocol. Always verify any MCP server is trusted and secure before using it on proprietary codebases."]},{"n":18,"title":"GitHub Copilot: Custom Instructions for AI Agents","text":["GitHub Copilot: Custom Instructions for AI Agents",".github/copilot-instructions.md — the AI's persistent memory for your codebase","What It Does:","Teaches Copilot your project's unique architecture and patterns","Encodes critical developer workflows: build, test, debug commands","Describes integration points and service boundaries","Explains 'why' decisions were made, not just 'what' exists","Merges intelligently on update — preserves valuable content","One-Time Agent Prompt to Generate It:","Analyze this codebase to generate or","update .github/copilot-instructions.md","for guiding AI coding agents.","Focus on:","- Architecture requiring multi-file reading","- Build/test/debug workflows & commands","- Project-specific patterns vs. common practice","- Integration points & service boundaries","Guidelines:","- ~20-50 lines, markdown structure","- Specific examples from THIS codebase","- No generic advice ('write tests')","- Document discoverable patterns only","- Merge intelligently if file exists","Run this prompt once in Agent mode — Copilot will scan the codebase, generate the file, and ask for feedback to iterate."]},{"n":19,"title":"When AI Adds, Humans Must Subtract","text":["When AI Adds, Humans Must Subtract","Increasing context window tokens or letting AI try more alternative paths won't rescue a model that has gone off-track. More compute on a flawed trajectory is simply brute-force in the wrong direction. The AI needs a reset — not more tokens.","Git Reset to Clean State","When an AI session goes off the rails, git reset to the last stable commit — or git checkout specific files from a known-good commit. Restart from a clean foundation rather than compounding bad decisions on top of each other.","git reset HEAD~N  ·  git checkout <sha> -- path/to/file","Switch Models for Fresh Perspective","A different LLM could breaks through bottlenecks. Paste the problematic files into a chatbot-based model for independent analysis and path suggestions. The 'outsider perspective' often surfaces what the stuck model cannot see.","Gemini → Claude → Codex → repeat","Inject External Insights Back to IDE","Relay the third-party model's recommendations back into your IDE's AI chat window. This 'insight injection' technique unblocks the stalled agent without losing the codebase context it has already built up.","Copy suggestion → paste into IDE chat → resume"]},{"n":20,"title":"4 Field Principles: When AI Adds, Humans Must Subtract","text":["4 Field Principles: When AI Adds, Humans Must Subtract","Hard-won lessons from 6+ weeks of continuous multi-model AI-assisted development","01","Git Reset to a Clean State","When AI spirals, git reset to the last stable commit rather than letting it compound bad decisions. More tokens on a flawed trajectory is just brute-force in the wrong direction.","02","Switch Models for Fresh Perspective","A different LLM often breaks through bottlenecks. Paste the problematic files into a chatbot-based LLM for independent analysis; bring those path suggestions back to your IDE.","03","Nail the Algorithm Early","If core backend algorithms are not solid in the first few iterations, even restoring to a stable baseline compounds drift. AI excels at prototyping; it is not yet a reliable refactoring partner.","04","Own the Strategy, Not Just the Prompt","Use AI to accelerate skeleton generation, syntax retrieval, and migration — but always own the test logic, selector strategy, and overall quality bar yourself. Speed without correctness is liability."]},{"n":21,"title":"Vibe Coding in Action: Testing-Aiding Tools","text":["Vibe Coding in Action: Testing-Aiding Tools","Real-world AI-assisted tools built for testing facilitation — explore the live applications via the links below","(A)","BugGenie AI","Google Gemini–Powered Bug Ticket Drafting Tool","BugGenie AI turns screenshots and supporting artefacts into structured, professional bug reports — directly in the browser, with no backend or installation required.","Powered by Google Gemini via AI Studio","Browser-based — no install, no build step","Accepts screenshots & supporting artefacts","Outputs structured, ready-to-file bug tickets","⌥ GitHub Source Code Repository: https://github.com/hockchiyeer/ai-powered-auto-bug-ticket-logger","▶  Live App: https://aistudio.google.com/apps/ce12cbda-aa17-405d-9018-96a8ef249d29?showPreview=true&showAssistant=true"]},{"n":22,"title":"(A)","text":["(A)","BugGenie AI","Google Gemini–Powered Bug Ticket Drafting Tool"]},{"n":23,"title":"Vibe Coding in Action: Testing-Aiding Tools","text":["Vibe Coding in Action: Testing-Aiding Tools","Real-world AI-assisted tools built for testing facilitation — explore the live applications via the links below","(B)","Agile Maturity Assessment App","Browser-Native Static JavaScript Application","A fully self-contained Agile maturity assessment app that runs by simply opening index.html — no build step, no package install, no dev server, and no deployment wrapper required.","⌥ GitHub Source Code Repository: https://github.com/hockchiyeer/google-ai-studio-generated-agile-maturity-assessment-app/tree/task/branch-for-github-page-deployment","▶  Live App: https://hockchiyeer.github.io/google-ai-studio-generated-agile-maturity-assessment-app/","100% browser-native — pure HTML, CSS & JS","Zero-dependency: no npm, no bundler, no server","Open index.html directly to run locally","Deployable to GitHub Pages in one step"]},{"n":24,"title":"(A)","text":["(A)","Agile Maturity Assessment App","Google Gemini–Powered Bug Ticket Drafting Tool"]},{"n":25,"title":"Key Takeaways","text":["Key Takeaways","AI is a Prototype Powerhouse","Current AI tools are outstanding for rapid prototyping and POC development, but are not yet reliable partners for long-term refactoring and maintenance.","UI Automation Exposes AI's Limits","Probabilistic models fundamentally clash with the deterministic, zero-tolerance nature of reliable UI test automation. Expect humans to close the gap.","The Subtract Principle","When AI starts compounding complexity, the correct response is to simplify — reset to a clean state, switch models, and inject external insights.","Use LLMs as Accelerators, Not Authorities","Generate skeletons, retrieve syntax, debug with context, migrate frameworks — but always own the logic, the selectors, and the test strategy yourself."]}]}`),politics:{file:"AI政治策略课程_完整版.pptx",count:21,slides:[{n:1,title:"AI × 政治策略 课程",text:["AI × 政治策略 课程","AI是你的镜子","更是一把双面刃","政治团队如何用AI赢得选票（而非流失选票）","~ By ChatGPT","© AI Guru Course  |  版权所有"]},{n:2,title:"第一课 · 核心认知",text:["第一课 · 核心认知","你的团队正在用AI做什么？","✍️","写更多文案","批量生产帖子、声明、新闻稿","🖼️","做更多图片","自动生成宣传海报与制图","🎬","产更多视频","AI短视频、配音、字幕","⚠️  这些都只是AI最表面的用法 — 如果原本的方法就是错误的，AI只会让你「更快犯同样的错误」。"]},{n:3,title:"第二课 · 镜子原理",text:["第二课 · 镜子原理","AI 不会","让你变聪明","它只会放大你团队既有的操作模式，产生更大的效应。","聪明的团队 → AI加速成功","平庸的团队 → AI复制平庸","错误的团队 → AI放大失败","🪞  AI 的镜子效应","你的操作模式（输入）","⬇️","AI  ×  放大器","⬇️","放大后的结果（×5）","正确方法的5倍成效  或  错误方法的5倍损害"]},{n:4,title:"第三课 · 放大效应",text:["第三课 · 放大效应","Amplifier Effect — 双向放大定律","❌","错误方法 × AI","=","加速走向荷兰","更快 · 更便宜 · 更有效率地犯错","Multiplier Effect（负向）","✅","正确方法 × AI","=","指数级赢得选票","更精准 · 更有影响力 · 更值得投入","Multiplier Effect（正向）","VS"]},{n:5,title:"第四课 · 正确起点",text:["第四课 · 正确起点","应用AI的第一步，不是内容生产","❌  大多数团队这样问AI",'"帮我写一篇选举文案"','"生成五张竞选海报"','"制作10条短视频脚本"','"写一篇攻击对
